const BENCHMARK_SCORES = [51, 52, 52, 53, 53, 53, 53, 53, 53, 55, 55, 55, 56, 56, 57, 57, 57, 57, 57, 57, 58, 58, 58, 58, 58, 58, 59, 59, 59, 59, 59, 60, 60, 61, 61, 61, 62, 62, 62, 62, 62, 62, 63, 63, 63, 63, 63, 64, 64, 64, 64, 65, 65, 66, 66, 66, 66, 66, 67, 67, 67, 67, 68, 68, 68, 68, 68, 69, 69, 69, 69, 69, 69, 69, 70, 70, 71, 71, 71, 71, 71, 72, 72, 72, 72, 72, 72, 73, 73, 73, 73, 73, 74, 74, 74, 74, 74, 75, 75, 75, 75, 75, 76, 76, 76, 76, 77, 77, 77, 78, 78, 78, 78, 79, 79, 79, 80, 80, 80, 81, 81, 82, 82, 82, 82, 83, 83, 83, 83, 83, 84, 84, 84, 84, 85, 85, 86, 87, 87, 87, 87, 87, 88, 89, 89, 89, 89, 89, 89, 90, 90, 90, 91, 91, 92, 93, 93, 93, 93, 93, 93, 93, 93, 93, 94, 94, 95, 95, 95, 96, 97, 97, 97, 98, 98, 99, 99, 99, 99, 100, 100, 100, 100, 100, 101, 101, 101, 101, 101, 102, 102, 102, 103, 103, 104, 105, 105, 105, 105, 105, 106, 107, 107, 107, 108, 108, 108, 108, 108, 108, 109, 109, 109, 109, 110, 110, 111, 111, 112, 113, 113, 113, 113, 114, 114, 114, 116, 116, 116, 117, 119, 119, 119, 119, 120, 120, 120, 122, 122, 122, 122, 122, 122, 125, 128, 128, 128, 129, 129, 129, 130, 130, 131, 131, 132, 133, 133, 134, 135, 135, 136, 137, 137, 138, 139, 139, 140, 140, 141, 141, 141, 141, 143, 144, 144, 145, 146, 147, 147, 148, 149, 149, 149, 149, 150, 150, 152, 152, 153, 155, 156, 159, 159, 161, 162, 163, 164, 164, 165, 165, 166, 167, 168, 170, 170, 173, 173, 176, 177, 180, 181, 183, 185, 186, 187, 187, 189, 190, 193, 194, 194, 194, 197, 197, 197, 208, 211, 212, 212, 214, 220, 224, 226, 227, 227, 229, 231, 233, 233, 239, 246, 252, 265, 268, 269, 283, 288, 310, 335, 341];
function benchmarkHtml(){
  const hofMult = (DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano).hofMult;
  const raw = S.finalScore * hofMult;
  const n = BENCHMARK_SCORES.length;
  const below = BENCHMARK_SCORES.filter(x=>x < raw).length;
  const pct = Math.min(99, Math.max(1, Math.round(below/n*100)));
  const share = th => Math.max(1, Math.round(BENCHMARK_SCORES.filter(x=>x>=th).length/n*100));
  return `
    <div class="card">
      <h2 class="section">How rare was your career?</h2>
      <p class="lead" style="margin-bottom:10px;">Your legacy beats <b style="color:var(--gold);">${pct}%</b> of the benchmark careers.</p>
      <div class="meta-row">
        <span class="chip">Reach "One vote from the statue" <b>${share(155)}%</b></span>
        <span class="chip">Earn the statue <b>${share(210)}%</b></span>
      </div>
      <p class="sub" style="margin-top:10px; opacity:.75;">Benchmark: ${n} simulated careers with random decisions on Veteran difficulty. This isn't data from other players; with good decisions you can beat most of them.</p>
    </div>`;
}

function renderEnd(){
  if((S.achievements||[]).length) playAchievementSound();
  const tl = S.timeline.slice(-10).map(t=>`<div><span class="yr">${t.yr}:</span> ${t.text}</div>`).join('');
  const careerStatChips = Object.keys(S.careerStats).map(k=>`
    <div class="stat"><div class="v">${S.careerStats[k]}</div><div class="k">${k}</div></div>
  `).join('');
  const records = checkRecords();
  const achievementsHtml = (S.achievements||[]).length ? `
    <div class="divider"></div>
    <h2 class="section">Achievements Unlocked</h2>
    <div class="shop-grid">
      ${S.achievements.map(a=>`
        <div class="shop-item owned">
          <div class="shop-icon">${a.icon}</div>
          <div class="shop-info"><div class="shop-name">${a.name}</div><p class="sub" style="margin:2px 0 0;">${a.desc()}</p></div>
        </div>
      `).join('')}
    </div>
  ` : '';
  el(`
    <div class="eyebrow">${S.isDaily ? `Daily Career · ${S.dailySeedLabel}` : 'Will you earn the statue?'}</div>
    <h1 class="display">${S.name}</h1>
    ${S.nickname ? `<p class="sub" style="margin:-6px 0 10px; color:var(--gold); font-weight:600;">«${S.nickname}»</p>` : ""}
    <div class="team-row">${jerseyHtml(S.team, S.jerseyNumber, 64)}<div class="tname" style="font-size:16px;">${pos().label} #${S.jerseyNumber}<small>${S.seasonsPlayed} seasons · Peak overall ${Math.round(S.peakOvr)}</small></div></div>
    <div class="hof-banner">
      <div class="eyebrow" style="margin:0;">Verdict</div>
      <div class="tier text-3d">${S.finalTier}</div>
      <p class="sub" style="max-width:480px;margin:0 auto;">${S.finalTierDesc}</p>
      ${S.finalScore >= 155 ? `<button class="btn" id="hofBtn" style="margin-top:14px;">🏛️ See Your Canton Induction</button>` : ''}
    </div>
    <div class="card ending-card">
      <div class="cinematic-kicker" style="margin-bottom:6px;">Your ending</div>
      <div class="ending-title">${(S.ending||computeEnding()).icon} ${(S.ending||computeEnding()).title}</div>
      <p class="sub" style="margin:6px 0 0; color:var(--chalk);">${(S.ending||computeEnding()).text}</p>
    </div>
    <div class="card">
      <h2 class="section">${S.closingLine}</h2>
      ${S.postCareerPath ? `<p class="sub">${S.postCareerPath.icon} After retiring, your path was that of <b style="color:var(--chalk);">${S.postCareerPath.name}</b>: ${S.postCareerPath.desc}</p>` : ''}
      <p class="sub" style="margin-top:8px;">🏷️ ${playstyleLabel()}</p>
      <div class="meta-row" style="margin-top:10px;">
        <span class="chip">Legacy Score <b>${S.finalScore}</b></span>
        <span class="chip">Career Earnings <b>$${S.money}M USD</b></span>
      </div>
      ${records.length ? `<div class="divider"></div><div class="bullet-list">${records.map(r=>`<div class="bullet" style="border-left-color:var(--gold);">🏈 ${r}</div>`).join('')}</div>` : ''}
      ${achievementsHtml}
      ${draftClassComparisonHtml()}
      <div class="divider"></div>
      <h2 class="section">Your Year-by-Year Progression</h2>
      ${ovrEvolutionSvg()}
      <div class="divider"></div>
      <h2 class="section">Your Full Career Stats</h2>
      <div class="statbar" style="margin-bottom:16px;">${careerStatChips}</div>
    </div>
    ${finalTrophyVitrineHtml()}
    ${benchmarkHtml()}
    <div class="card">
      <h2 class="section">Shareable Card</h2>
      ${shareCardHtml()}
      <button class="btn" id="downloadCardBtn" style="width:100%; margin-top:14px;">📸 Download Card</button>
    </div>
    <div class="card">
      <h2 class="section">Final chapters of your story</h2>
      <div class="timeline">${tl}</div>
      <div class="divider"></div>
      <div class="btn-row">
        <button class="btn" id="againBtn">Play another career</button>
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <p class="sub" style="margin-bottom:12px;">Enjoyed the simulator? You can buy me a coffee to help me keep improving it.</p>
      <a href="https://www.paypal.com/ncp/payment/JWNYCGQ3SMW7J" target="_blank" rel="noopener" class="btn secondary" style="width:100%; display:block; text-decoration:none; text-align:center;">☕ Support the Project</a>
    </div>
    <p class="sub" style="text-align:center; opacity:.7;">Unofficial fan-made simulator. Not affiliated with the NFL or any of its franchises.</p>
  `);
  document.getElementById('againBtn').addEventListener('click', newGame);
  const hofBtn = document.getElementById('hofBtn');
  if(hofBtn) hofBtn.addEventListener('click', ()=>{ S.screen='hofinduction'; render(); });
  document.getElementById('downloadCardBtn').addEventListener('click', ()=>{
    const node = document.getElementById('shareCard');
    if(typeof html2canvas === 'undefined'){ alert('Could not load the image generator. Try again with an internet connection.'); return; }
    html2canvas(node, {backgroundColor:'#0c1836', scale:2}).then(canvas=>{
      const link = document.createElement('a');
      link.download = `${S.name.replace(/\s+/g,'_')}_el_goat.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });
  animateCountUp();
}

function renderHofInduction(){
  const yearsLater = Math.round(rand(3,6));
  el(`
    <div class="confetti-wrap">${Array.from({length:24}, ()=>{
      const left = Math.round(Math.random()*100);
      const delay = (Math.random()*1.2).toFixed(2);
      const dur = (2.2 + Math.random()*1.6).toFixed(2);
      const colors = ['#d7ad3f','#c8102e','#ffffff'];
      const color = colors[Math.floor(Math.random()*colors.length)];
      return `<div class="confetti-piece" style="left:${left}%; animation-delay:${delay}s; animation-duration:${dur}s; background:${color};"></div>`;
    }).join('')}</div>
    <div class="cinematic">
      <div class="cinematic-kicker">Canton, Ohio · ${yearsLater} years later</div>
      <div style="margin-bottom:10px;">${icon('trophy',72,'var(--gold)')}</div>
      <h1 class="cinematic-hero">Hall of<br>Fame</h1>
      <p class="lead" style="max-width:520px; margin:0 auto 16px;">${yearsLater} years after hanging up the cleats, ${S.name} walks up to the podium in Canton. The bronze bust with your face is unveiled, and your gold jacket hangs beside those of the legends who defined this league.</p>
      <div class="feedback-block" style="text-align:left; max-width:520px; margin:0 auto 14px;">
        <p class="feedback-quote">"I never played thinking about this moment. I played for my teammates, for my city, for the love of this game. But being here today, in my gold jacket... that's priceless."</p>
        <p class="sub">— ${S.name}, induction speech</p>
      </div>
      <div class="meta-row" style="justify-content:center;">
        <span class="chip">Rings <b>${S.rings}</b></span>
        <span class="chip">MVP <b>${S.mvps}</b></span>
        <span class="chip">Pro Bowls <b>${S.proBowls}</b></span>
        <span class="chip">Legacy Score <b>${S.finalScore}</b></span>
      </div>
      <button class="btn" id="hofBackBtn" style="width:100%; max-width:340px; margin-top:16px;">← Back to Final Report</button>
    </div>
  `);
  document.getElementById('hofBackBtn').addEventListener('click', ()=>{ S.screen='end'; render(); });
}

document.getElementById('app').addEventListener('click', e=>{
  if(soundMode()==='all') startMusic();
  if(e.target.closest && e.target.closest('.choice-btn, .btn, .archetype-card, .offer-card, .pos-btn')) playTone(520,0.04,'triangle',0,0.05);
});
newGame();
})();
</script>
</body>
