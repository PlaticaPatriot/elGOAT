<title>The G.O.A.T. — NFL Career Simulator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --turf-dark:#05070f;
  --turf:#0b1730;
  --turf-line:#1f3363;
  --panel:#080f24;
  --chalk:#f2f3f5;
  --chalk-dim:#9aa7c4;
  --gold:#c8102e;
  --gold-dim:#7a0a1f;
  --danger:#d9772e;
  --info:#6f8fb0;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 2px, transparent 2px, transparent 110px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 90px),
    radial-gradient(circle at 15% 8%, rgba(200,16,46,.14), transparent 40%),
    radial-gradient(circle at 85% 4%, rgba(111,143,176,.12), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(200,16,46,.08), transparent 48%),
    radial-gradient(ellipse at top, #16265a 0%, var(--turf-dark) 55%);
  background-attachment: fixed;
  color:var(--chalk);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding:0;
  scrollbar-color: var(--gold-dim) var(--turf-dark);
  scrollbar-width: thin;
}
body::-webkit-scrollbar{ width:10px; }
body::-webkit-scrollbar-track{ background:var(--turf-dark); }
body::-webkit-scrollbar-thumb{ background:linear-gradient(180deg, var(--gold), var(--gold-dim)); border-radius:6px; }
body::-webkit-scrollbar-thumb:hover{ background:var(--gold); }
.screen-enter{ animation: screenFadeIn .32s ease both; }
@keyframes screenFadeIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}
#app{
  max-width:780px;
  margin:0 auto;
  padding:18px 16px 60px;
  position:relative;
}

/* ---- Site header / brand ---- */
.site-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:1px solid var(--turf-line);
}
.site-header img{
  width:46px; height:46px;
  border-radius:50%;
  border:2px solid var(--gold-dim);
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.site-header .brand{
  font-family:'Bebas Neue',sans-serif;
  font-size:19px;
  letter-spacing:2px;
  color:var(--chalk);
  line-height:1.1;
  flex:1;
  min-width:0;
}
.header-donate-btn{
  flex-shrink:0;
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  background:rgba(215,173,63,.12);
  border:1px solid var(--gold-dim);
  font-size:16px;
  text-decoration:none;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease;
}
.header-donate-btn:hover{ transform:scale(1.08); background:rgba(200,16,46,.2); }
.site-header .brand small{
  display:block;
  font-family:'Oswald',sans-serif;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:600;
  margin-top:2px;
}

/* ---- Field tracker (signature element) ---- */
.field-tracker{
  position:relative;
  height:34px;
  border-radius:6px;
  background:repeating-linear-gradient(90deg, #142a5c 0 40px, #0e2049 40px 80px);
  border:1px solid var(--turf-line);
  overflow:hidden;
  margin-bottom:18px;
}
.field-tracker .zone-label{
  position:absolute;
  top:0; bottom:0;
  display:flex;
  align-items:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:13px;
  letter-spacing:2px;
  color:var(--chalk-dim);
  padding:0 10px;
}
.field-tracker .zone-label.start{left:0;}
.field-tracker .zone-label.end{right:0; color:var(--gold); font-weight:600;}
.field-tracker .marker{
  position:absolute;
  top:2px; bottom:2px;
  width:3px;
  background:var(--gold);
  box-shadow:0 0 8px var(--gold);
  border-radius:2px;
  transition:left .5s ease;
}

/* ---- Layout blocks ---- */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 45%), var(--panel);
  border:1px solid var(--turf-line);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, transparent, var(--gold) 30%, #ff3b5c 70%, transparent);
  opacity:.85;
}
h1.display{
  font-family:'Anton',sans-serif;
  font-size:clamp(32px,8.5vw,50px);
  letter-spacing:.5px;
  text-transform:uppercase;
  color:var(--chalk);
  margin:0 0 6px;
  line-height:1.02;
  text-shadow:
    1px 1px 0 var(--gold-dim),
    2px 2px 0 var(--gold-dim),
    3px 3px 0 #4a0713,
    4px 5px 8px rgba(0,0,0,.6);
}
h1.display span{color:var(--gold); text-shadow:1px 1px 0 var(--gold-dim), 2px 2px 0 #4a0713, 3px 4px 8px rgba(0,0,0,.6), 0 0 26px rgba(200,16,46,.55);}
.text-3d{
  text-shadow:
    1px 1px 0 var(--gold-dim),
    2px 2px 0 var(--gold-dim),
    3px 3px 0 #4a0713,
    4px 5px 10px rgba(0,0,0,.65);
}
.eyebrow{
  font-family:'Bebas Neue',sans-serif;
  font-size:15px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 6px;
  position:relative;
  display:inline-block;
}
.eyebrow::after{
  content:'';
  display:block;
  width:36px; height:3px;
  background:linear-gradient(90deg, var(--gold), #ff3b5c);
  margin-top:6px;
  border-radius:2px;
  box-shadow:0 0 8px rgba(200,16,46,.6);
}
h2.section{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:.4px;
  text-transform:uppercase;
  margin:0 0 12px;
  color:var(--chalk);
}
p.lead{color:var(--chalk-dim); line-height:1.55; margin:0 0 16px; font-size:15px;}
.sub{color:var(--chalk-dim); font-size:13px; line-height:1.5;}

/* ---- Team badge ---- */
.team-shield{ flex-shrink:0; filter:drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
.jersey-svg{ flex-shrink:0; filter:drop-shadow(0 4px 8px rgba(0,0,0,.55)); }

/* ---- Celebration confetti ---- */
.confetti-wrap{
  position:fixed; top:0; left:0; right:0; height:100vh;
  overflow:hidden; pointer-events:none; z-index:0;
}
.confetti-piece{
  position:absolute; top:-20px;
  width:9px; height:14px;
  opacity:.9;
  animation-name: confetti-fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
@keyframes confetti-fall{
  0%{ transform:translateY(0) rotate(0deg); opacity:1; }
  100%{ transform:translateY(110vh) rotate(360deg); opacity:.7; }
}
.team-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.team-row .tname{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px;}
.team-row .tname small{display:block; color:var(--chalk-dim); font-weight:400; font-size:11.5px; letter-spacing:.5px; text-transform:uppercase;}

/* ---- Stat bar ---- */
.statbar{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-bottom:16px;
}
.stat{
  background:linear-gradient(160deg, rgba(255,255,255,.04), transparent 60%), var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:8px 4px;
  text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 6px rgba(0,0,0,.25);
}
.stat .v{font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.5px; color:var(--chalk);}
.stat .k{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--chalk-dim);}
.stat.warn .v{color:var(--danger); text-shadow:0 0 10px rgba(217,119,46,.5);}
.stat.good .v{color:var(--gold); text-shadow:0 0 10px rgba(200,16,46,.5);}
.statbar-4{grid-template-columns:repeat(4,1fr);}

/* ---- Player card (hexagonal HUD) ---- */
.player-card{
  clip-path: polygon(0 14px, 14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px));
  background:
    radial-gradient(ellipse at 15% 0%, rgba(200,16,46,.18), transparent 55%),
    linear-gradient(135deg, #101d40, var(--panel));
  border:1px solid var(--gold-dim);
  box-shadow:0 0 0 1px rgba(200,16,46,.15), 0 14px 36px rgba(0,0,0,.5);
  padding:18px;
  margin-bottom:18px;
}
.pc-top{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}
.pc-ovr{ text-align:center; flex-shrink:0; }
.pc-ovr-num{ font-family:'Anton',sans-serif; font-size:44px; line-height:1; color:var(--chalk); text-shadow:1px 1px 0 var(--gold-dim), 2px 2px 0 #4a0713, 3px 4px 6px rgba(0,0,0,.6); }
.pc-ovr-label{ font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:2px; color:var(--chalk-dim); text-transform:uppercase; }
.pc-id{ flex:1; min-width:0; }
.pc-name{ font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px; color:var(--chalk); }
.pc-form{ font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:1px; color:var(--chalk-dim); margin-top:2px; }
.pc-form.up{ color:var(--gold); }
.pc-form.down{ color:var(--danger); }
.stage-tag{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border:1px solid var(--gold-dim);
  border-radius:12px;
  padding:10px 14px;
  background:rgba(200,16,46,.06);
}
.stage-label{ font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1.5px; color:var(--gold); }

.money-line{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:8px 12px;
  margin-bottom:12px;
}
.money-amount{ font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.5px; color:#7fd68f; }
.shop-btn{
  background:rgba(215,173,63,.08);
  border:1px solid var(--gold-dim);
  color:var(--gold);
  font-family:'Oswald',sans-serif; font-weight:600; font-size:11.5px;
  border-radius:10px; padding:6px 10px; cursor:pointer;
}
.shop-btn:hover{ background:rgba(200,16,46,.15); }

/* ---- Archetype cards ---- */
.archetype-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;
}
.archetype-card{
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:16px;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.archetype-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
.archetype-name{ font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.5px; color:var(--chalk); margin-bottom:6px; }
.archetype-card .tags{ margin-top:10px; }

/* ---- Transfer market offer cards ---- */
.offer-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.offer-card{
  position:relative;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:14px 14px 14px;
  overflow:hidden;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.offer-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
.offer-bar{ position:absolute; top:0; left:0; right:0; height:5px; }
.offer-badge{
  position:absolute; top:10px; right:10px;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.5px;
  text-transform:uppercase;
  padding:3px 8px; border-radius:10px;
  border:1px solid var(--gold-dim); color:var(--gold);
  background:rgba(200,16,46,.1);
}
.offer-badge.good{ border-color:#3f7a4a; color:#7fd68f; background:rgba(63,122,74,.15); }
.offer-team-row{ display:flex; align-items:center; gap:8px; margin:8px 0 8px; }
.offer-team-name{ font-family:'Oswald',sans-serif; font-weight:600; font-size:12.5px; color:var(--chalk); line-height:1.2; }
.offer-salary{ font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--gold); letter-spacing:.5px; }
.offer-salary span{ font-family:'Inter',sans-serif; font-size:10.5px; color:var(--chalk-dim); letter-spacing:0; margin-left:4px; }
.offer-quote{ font-size:12px; font-style:italic; color:var(--chalk-dim); margin:8px 0; line-height:1.4; }
.offer-upside{ font-size:10.5px; color:#7fd68f; font-weight:600; }
.offer-bonus{ font-size:11px; color:var(--chalk-dim); margin:2px 0 4px; }
.offer-downside{ font-size:10.5px; color:#f0a868; font-weight:600; }
@media (max-width:480px){
  .offer-grid{ grid-template-columns:1fr; }
}

.meta-row{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-bottom:16px;
}
.chip{
  background:linear-gradient(160deg, rgba(255,255,255,.04), transparent), var(--turf);
  border:1px solid var(--turf-line);
  border-radius:20px;
  padding:5px 12px;
  font-size:12.5px;
  color:var(--chalk-dim);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.chip b{color:var(--chalk); font-weight:600;}

/* ---- Choice buttons ---- */
.choices{display:flex; flex-direction:column; gap:10px;}
.choice-btn{
  background:linear-gradient(135deg, var(--turf), rgba(255,255,255,.015));
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:14px 16px;
  text-align:left;
  color:var(--chalk);
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  transition:border-color .15s, transform .12s, background .15s, box-shadow .15s;
  width:100%;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.choice-btn:hover{border-color:var(--gold); background:#16265a; transform:translateY(-2px); box-shadow:0 6px 18px rgba(200,16,46,.25);}
.choice-btn:active{transform:scale(0.99);}
.choice-btn .label{font-weight:600; display:block; margin-bottom:4px;}
.rarity-badge{
  display:block;
  font-family:'Oswald',sans-serif;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:1.5px;
  margin-bottom:5px;
}
.choice-btn .tags{display:flex; gap:6px; flex-wrap:wrap;}
.tag{
  font-size:10.5px;
  padding:2px 7px;
  border-radius:10px;
  letter-spacing:.3px;
  font-family:'Oswald',sans-serif;
}
.tag.up{background:rgba(215,173,63,.15); color:var(--gold);}
.tag.down{background:rgba(217,119,46,.15); color:#f0a868;}
.tag.risk{background:rgba(217,119,46,.22); color:#f5c295;}
.tag.info{background:rgba(111,143,176,.2); color:#b8cbe0;}

/* ---- Buttons general ---- */
.btn{
  display:inline-block;
  background:linear-gradient(135deg, #ff3b5c, var(--gold) 60%, var(--gold-dim));
  color:#fff5f5;
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:1px;
  font-size:17px;
  border:none;
  border-radius:10px;
  padding:12px 24px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(200,16,46,.35);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(200,16,46,.5); filter:brightness(1.08); }
.btn:active{ transform:translateY(0); }
.btn.secondary{
  background:transparent;
  border:1px solid var(--gold-dim);
  color:var(--gold);
  box-shadow:none;
}
.btn.secondary:hover{background:rgba(215,173,63,.08); box-shadow:none; transform:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* ---- Intro forms ---- */
.option-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
  margin-bottom:20px;
}
.pos-btn{
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:12px 10px;
  cursor:pointer;
  text-align:center;
  color:var(--chalk);
}
.pos-btn .code{font-family:'Anton',sans-serif; font-size:24px; color:var(--gold); display:block;}
.pos-btn .name{font-size:11.5px; color:var(--chalk-dim); display:block; margin-top:2px;}
.pos-btn.selected{border-color:var(--gold); background:#16265a;}

input[type=text],input[type=number]{
  width:100%;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:10px;
  padding:12px 14px;
  color:var(--chalk);
  font-size:15px;
  font-family:'Inter',sans-serif;
  margin-bottom:18px;
}
input[type=text]:focus,input[type=number]:focus{outline:none; border-color:var(--gold);}
input[type=number]{ font-family:'Bebas Neue',sans-serif; font-size:20px; text-align:center; }
.name-number-row{ display:flex; gap:12px; align-items:flex-start; }

.event-graphic{
  margin:-20px -20px 16px;
  border-bottom:1px solid var(--turf-line);
  overflow:hidden;
  box-shadow:inset 0 -20px 34px -20px rgba(0,0,0,.85);
}
.event-graphic svg{ display:block; border-radius:0 !important; }

.event-icon{
  font-family:'Bebas Neue',sans-serif;
  font-size:14px;
  color:var(--gold-dim);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:6px;
}

.divider{height:1px; background:var(--turf-line); margin:16px 0;}

/* ---- Season article (newspaper style) ---- */
.article-mast{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:3px double var(--turf-line);
  padding-bottom:8px;
  margin-bottom:14px;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#6f8fb0;
}
.article-date{ color:var(--chalk-dim); font-weight:500; letter-spacing:1px; font-size:10.5px; }
.article-headline{
  font-family:'Anton',sans-serif;
  text-transform:uppercase;
  font-size:clamp(24px,6vw,32px);
  line-height:1.05;
  color:var(--chalk);
  margin:0 0 12px;
  text-shadow:1px 1px 0 var(--gold-dim), 2px 2px 0 #4a0713, 3px 4px 6px rgba(0,0,0,.55);
}
.bullet-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }

/* ---- Draft Card ---- */
.draft-card{
  position:relative;
  background:linear-gradient(160deg, #101d40, var(--panel));
  border:2px solid var(--gold);
  border-radius:16px;
  padding:24px 20px 20px;
  text-align:center;
  overflow:hidden;
  box-shadow:0 12px 32px rgba(0,0,0,.55);
}
.draft-card-bar{ position:absolute; top:0; left:0; right:0; height:8px; }
.draft-card-header{
  display:flex; justify-content:space-between;
  font-family:'Oswald',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px;
  color:var(--gold); margin:10px 0 18px;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function refillQueue(pos){
  const pool = EVENT_POOL.filter(e => e.groups.includes('all') || e.groups.includes(pos.group));
  eventQueue = shuffle(pool);
}

function nextEvent(pos){
  if(eventQueue.length === 0) refillQueue(pos);
  return eventQueue.pop();
}

function rand(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

let _audioCtx = null;
const SOUND_KEY = 'plp_goat_sound_v1';
function getSoundMode(){
  try{ return localStorage.getItem(SOUND_KEY) || 'sfx'; }catch(e){ return 'sfx'; }
}
function setSoundMode(m){
  try{ localStorage.setItem(SOUND_KEY, m); }catch(e){}
  window.__soundMode = m;
}
function soundMode(){ return window.__soundMode || getSoundMode(); }
function soundGlyph(){ const m = soundMode(); return m==='all' ? '🎵' : (m==='sfx' ? '🔊' : '🔇'); }
function soundTitle(){ const m = soundMode(); return m==='all' ? 'Music and effects' : (m==='sfx' ? 'Effects only' : 'Muted'); }
function playTone(freq, duration, type, delay, volume, isMusic){
  if(soundMode()==='off') return;
  if(isMusic && soundMode()!=='all') return;
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = _audioCtx;
    if(ctx.state === 'suspended') ctx.resume();
    const startAt = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type||'sine';
    osc.frequency.value = freq;
    if(isMusic){
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(volume||0.03, startAt+Math.min(1.2, duration*0.3));
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt+duration);
    } else {
      gain.gain.setValueAtTime(volume||0.12, startAt);
      gain.gain.exponentialRampToValueAtTime(0.001, startAt+duration);
    }
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(startAt); osc.stop(startAt+duration);
  }catch(e){}
}

function moodForScreen(){
  if(!S) return 'hype';
  const sc = S.screen;
  if(sc==='menu' || sc==='history' || sc==='intro' || sc==='highschool') return 'hype';
  if(sc==='prep' || sc==='combine' || sc==='combinesummary') return 'drive';
  if(sc==='bigboard' || sc==='draftcard' || sc==='draftresult') return 'anthem';
  if(sc==='injurymoment') return 'dark';
  if(sc==='celebration' || sc==='hofinduction') return 'triumph';
  if(sc==='retirementceremony' || sc==='end' || sc==='postcareer' || sc==='retireprompt') return 'anthem';
  if(sc==='event'){
    const ev = S.pendingEvent;
    if(ev && (ev.banner || (ev.resolveType && ev.resolveType!=='normal'))) return 'tension';
    return 'groove';
  }
  return 'chill';
}
function musicNoise(ctx){
  if(_mus.noise) return _mus.noise;
  const len = ctx.sampleRate * 0.5;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  _mus.noise = buf; return buf;
}
function mKick(ctx,t,vol){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+0.13);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g); g.connect(_mus.gain); o.start(t); o.stop(t+0.22);
}
function mNoise(ctx,t,dur,vol,hp){
  const src = ctx.createBufferSource(); src.buffer = musicNoise(ctx);
  const f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value = hp;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f); f.connect(g); g.connect(_mus.gain); src.start(t); src.stop(t+dur+0.02);
}
function mNote(ctx,t,freq,dur,type,vol,attack){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+(attack||0.01));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(_mus.gain); o.start(t); o.stop(t+dur+0.02);
}
function musicStep(ctx,t,m){
  const st = _mus.step, bar = _mus.bar;
  const rootOff = m.prog[bar % m.prog.length];
  const stepDur = 60 / m.bpm / 4;
  if(m.kick[st]==='x') mKick(ctx,t,0.34);
  if(m.snare[st]==='x'){ mNoise(ctx,t,0.14,0.16,1200); mNote(ctx,t,190,0.1,'triangle',0.08,0.002); }
  if(m.hat[st]==='x') mNoise(ctx,t,0.04,st%4===2?0.07:0.04,7000);
  if(m.bass[st]==='x'){
    const iv = [0,0,7,0,12,0,7,5][_mus.hits++ % 8];
    mNote(ctx,t,m.root*Math.pow(2,(rootOff+iv)/12),stepDur*1.7,'sawtooth',0.10,0.005);
  }
  if(m.lead[st]==='x'){
    const sc = m.minor ? SCALE_MINOR : SCALE_MAJOR;
    const deg = sc[(st*3 + bar*2) % sc.length];
    mNote(ctx,t,m.root*4*Math.pow(2,(rootOff+deg)/12),stepDur*2.4,m.leadWave,0.055,0.01);
  }
  if(st===0){
    const third = m.minor ? 3 : 4;
    [0,third,7].forEach(iv=> mNote(ctx,t,m.root*2*Math.pow(2,(rootOff+iv)/12),stepDur*15.5,'triangle',m.pad,0.35));
  }
}
function musicSchedule(){
  const ctx = _audioCtx;
  if(!ctx || soundMode()!=='all') return;
  const m = MOODS[_mus.mood];
  const stepDur = 60 / m.bpm / 4;
  while(_mus.next < ctx.currentTime + 0.25){
    try{ musicStep(ctx,_mus.next,m); }catch(e){}
    _mus.next += stepDur;
    _mus.step++;
    if(_mus.step >= 16){ _mus.step = 0; _mus.bar++; }
  }
}
function setMusicMood(mood){
  if(!MOODS[mood] || _mus.mood === mood) return;
  _mus.mood = mood;
  const ctx = _audioCtx;
  if(!ctx || !_mus.gain || !_mus.timer) return;
  const now = ctx.currentTime;
  _mus.gain.gain.cancelScheduledValues(now);
  _mus.gain.gain.setTargetAtTime(0.0001, now, 0.05);
  _mus.gain.gain.setTargetAtTime(0.7, now+0.32, 0.08);
  _mus.step = 0; _mus.bar = 0; _mus.hits = 0; _mus.next = now + 0.34;
}
function startMusic(){
  if(_mus.timer || soundMode()!=='all') return;
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = _audioCtx;
    if(ctx.state === 'suspended') ctx.resume();
    _mus.gain = ctx.createGain();
    _mus.gain.gain.value = 0.7;
    _mus.gain.connect(ctx.destination);
    _mus.mood = moodForScreen();
    _mus.step = 0; _mus.bar = 0; _mus.hits = 0;
    _mus.next = ctx.currentTime + 0.1;
    _mus.timer = setInterval(musicSchedule, 60);
  }catch(e){}
}
function stopMusic(){
  if(_mus.timer){ clearInterval(_mus.timer); _mus.timer = null; }
  if(_mus.gain){
    try{ _mus.gain.gain.setTargetAtTime(0.0001, _audioCtx.currentTime, 0.05); }catch(e){}
    const g = _mus.gain; _mus.gain = null;
    setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, 400);
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(!_audioCtx) return;
  try{
    if(document.hidden) _audioCtx.suspend();
    else if(soundMode()!=='off') _audioCtx.resume();
  }catch(e){}
});

const _nativeRandom = Math.random.bind(Math);
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(str){
  let seed = 0;
  for(let i=0;i<str.length;i++) seed = (seed*31 + str.charCodeAt(i)) | 0;
  return seed;
}

function combineFlavor(score){
  if(score >= 85) return "Historic combine mark! Scouts are already taking notes.";
  if(score >= 65) return "A solid showing that didn't go unnoticed.";
  if(score >= 40) return "An unremarkable result, no surprises.";
  return "A stumble the scouts won't forget anytime soon.";
}

  }

function renderAgilityDrill(){
  const bonus = S.combineTrainingBonus.agility||0;
  const info = COMBINE_DRILL_INFO.agility;
  el(`
    ${fieldTracker()}
    <div class="eyebrow">NFL Combine — Drill 3 of 4</div>
    <h1 class="display">${info.title}</h1>
    <div class="card">
      <p class="sub" style="margin-bottom:10px;">${info.desc}</p>
      ${bonus ? `<div class="chip" style="margin-bottom:12px;">Bonus from your prep: <b style="color:var(--gold);">+${bonus}</b></div>` : ''}
      <div id="drillStage">
        <div id="slalomTrack" class="slalom-track">
          <div class="slalom-lane" data-lane="0"></div>
          <div class="slalom-lane" data-lane="1"></div>
          <div class="slalom-lane" data-lane="2"></div>
          <div id="slalomPlayer" class="slalom-player">🏃</div>
        </div>
        <div class="slalom-controls">
          <button class="btn secondary" id="slalomLeft">◀</button>
          <div class="sub" id="slalomHud" style="align-self:center;">Hits: 0</div>
          <button class="btn secondary" id="slalomRight">▶</button>
        </div>
      </div>
    </div>
  `);
  const track = document.getElementById('slalomTrack');
  const playerEl = document.getElementById('slalomPlayer');
  const hud = document.getElementById('slalomHud');
  let lane = 1, hits = 0, tick = 0, spawned = 0, finished = false;
  const WAVES = 9, GAP = 9, SPEED = 5.2;   // % de la pista por tick
  const obstacles = [];
  function placePlayer(){ playerEl.style.left = (lane*33.33 + 16.66) + '%'; }
  placePlayer();
  function move(d){ if(finished) return; lane = clamp(lane + d, 0, 2); placePlayer(); }
  document.getElementById('slalomLeft').addEventListener('click', ()=>move(-1));
  document.getElementById('slalomRight').addEventListener('click', ()=>move(1));
  document.querySelectorAll('.slalom-lane').forEach(l=>{
    l.addEventListener('click', ()=>{ if(finished) return; lane = parseInt(l.dataset.lane); placePlayer(); });
  });
  const timer = setInterval(()=>{
    if(!document.getElementById('slalomTrack')){ clearInterval(timer); return; }
    tick++;
    if(spawned < WAVES && tick % GAP === 1){
      const count = Math.random() < 0.4 ? 2 : 1;
      const lanes = shuffle([0,1,2]).slice(0,count);
      lanes.forEach(ln=>{
        const e = document.createElement('div');
        e.className = 'slalom-obstacle'; e.textContent = '🛡️';
        e.style.left = (ln*33.33 + 16.66) + '%'; e.style.top = '-12%';
        track.appendChild(e);
        obstacles.push({lane:ln, y:-12, el:e, hit:false});
      });
      spawned++;
    }
    obstacles.forEach(o=>{
      o.y += SPEED;
      o.el.style.top = o.y + '%';
      if(!o.hit && o.y >= 76 && o.y <= 94 && o.lane === lane){
        o.hit = true; hits++;
        o.el.classList.add('hit');
        hud.textContent = 'Hits: ' + hits;
      }
    });
    for(let i=obstacles.length-1;i>=0;i--){
      if(obstacles[i].y > 110){ obstacles[i].el.remove(); obstacles.splice(i,1); }
    }
    if(!finished && spawned >= WAVES && obstacles.length === 0){
      finished = true; clearInterval(timer);
      const score = clamp(100 - hits*13 + bonus, 5, 100);
      S.combineScores.agility = score;
      flashDrillResult(score, ()=>{ S.combineStep=3; render(); });
    }
  }, 60);
}

function renderExtraPlaybookDrill(){
  const ROUTES = [
    {sym:'⬆️', name:'Go'}, {sym:'⬅️', name:'Slant L'}, {sym:'➡️', name:'Slant R'}, {sym:'⬇️', name:'Hook'},

  const info = POSITION_DRILL_INFO.skill;
  el(`

        <div class="playbook-grid">

        </div>
        <div class="sub" id="playbookProg" style="margin-top:10px;">0 / 5</div>
      </div>
    </div>
  `);
  const LEN = 5;
  const seq = Array.from({length:LEN}, ()=>Math.floor(Math.random()*4));
  const btns = document.querySelectorAll('.playbook-btn');
  const msg = document.getElementById('playbookMsg');
  const prog = document.getElementById('playbookProg');
  let pos_ = 0, accepting = false, done = false;
  function flash(i, ms){
    btns[i].classList.add('lit');
    setTimeout(()=>btns[i].classList.remove('lit'), ms);
  }
  function finish(){
    if(done) return; done = true; accepting = false;
    const score = clamp(Math.round(pos_/LEN*100), 5, 100);
    S.combineScores.extra = score;
    flashDrillResult(score, finishCombine);
  }
  function showSeq(k){
    if(!document.getElementById('playbookMsg')) return;
    if(k >= seq.length){
      msg.textContent = 'Your turn! Repeat the sequence';
      btns.forEach(b=>b.disabled = false);
      accepting = true;
      return;
    }
    flash(seq[k], 520);
    setTimeout(()=>showSeq(k+1), 750);
  }
  setTimeout(()=>showSeq(0), 900);
  btns.forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!accepting || done) return;
      const i = parseInt(b.dataset.i);
      flash(i, 180);
      if(i === seq[pos_]){
        pos_++;
        prog.textContent = pos_ + ' / ' + LEN;
        if(pos_ >= LEN) finish();
      } else {
        b.classList.add('wrong');
        msg.textContent = 'You messed up the play';
        finish();
      }
    });
  });
}

  }, 16);
  document.getElementById('kickBtn').addEventListener('click', ()=>{
    clearInterval(iv);
    const target = 80;
    const dist = Math.abs(pos_-target);
    const score = clamp(Math.round(100 - dist*3), 5, 100);
    S.combineScores.extra = score;
    flashDrillResult(score, finishCombine);
  });
}

const COLLEGE_STAT_LINES = {
  QB:(n)=>`In his final college season he threw for ${n} yards.`,
  RB:(n)=>`In his final college season he rushed for ${n} yards.`,
  WR:(n)=>`In his final college season he racked up ${n} receiving yards.`,
  TE:(n)=>`In his final college season he caught passes for ${n} yards.`,
  OL:(n)=>`Allowed only ${n} sacks over his entire final college season.`,
  DL:(n)=>`Recorded ${n} sacks in his final college season.`,
  LB:(n)=>`Racked up ${n} tackles in his final college season.`,
  CB:(n)=>`Recorded ${n} passes defended in his final college season.`,
  S:(n)=>`Recorded ${n} interceptions in his final college season.`,
  K:(n)=>`Converted ${n}% of his field goals in his final college season.`,
};

function generateCollegeStatLine(){
  const code = pos().code;
  let n;
  switch(code){
    case 'QB': n = Math.round(rand(2200,4200)); S.collegeStatBonus = (n-3200)/120; break;
    case 'RB': n = Math.round(rand(700,1900)); S.collegeStatBonus = (n-1250)/60; break;
    case 'WR': case 'TE': n = Math.round(rand(500,1400)); S.collegeStatBonus = (n-900)/45; break;
    case 'OL': n = Math.round(rand(0,6)); S.collegeStatBonus = (3-n)*2.5; break;
    case 'DL': case 'LB': n = Math.round(rand(3,14)); S.collegeStatBonus = (n-8)*1.6; break;
    case 'CB': n = Math.round(rand(4,18)); S.collegeStatBonus = (n-10)*1.3; break;
    case 'S': n = Math.round(rand(1,7)); S.collegeStatBonus = (n-4)*2.8; break;
    case 'K': n = Math.round(rand(72,96)); S.collegeStatBonus = (n-84)*0.9; break;
    default: n = 0; S.collegeStatBonus = 0;
  }
  return COLLEGE_STAT_LINES[code](n);
}

function finishCombine(){
  const sc = S.combineScores;
  S.combineScore = Math.round((sc.dash+sc.bench+sc.agility+sc.extra)/4);
  S.collegeStatLine = generateCollegeStatLine();
  S.screen = 'combinesummary';
  render();
}

function combineRealWorldLine(){
  const dashTime = (5.32 - (S.combineScores.dash/100)*1.04).toFixed(2);
  const benchReps = Math.round(7 + (S.combineScores.bench/100)*29);
  const agilityTime = (8.25 - (S.combineScores.agility/100)*1.85).toFixed(2);
  const pct = clamp(Math.round(S.combineScore + rand(-4,4)), 1, 99);
  return `You ran the 40-yard dash in <b>${dashTime}s</b>, did <b>${benchReps} reps</b> on the bench press, and posted <b>${agilityTime}s</b> in the 3-cone drill. That puts you ahead of <b>${pct}%</b> of the prospects in your class.`;
}

function runDraft(){
  const college = COLLEGES[S.collegeIdx];
  let score = college.stock + S.prepScoreByGroup[pos().group]*1.6 + (S.combineScore-50)*0.5 + (S.collegeStatBonus||0) + rand(-6,6);
  score = clamp(score, 0, 100);
  if(S.challenge === 'undrafted') score = Math.min(score, 15);

  let round, ovrBase, ovrRange;
  if(score >= 90){ round='Round 1'; ovrBase=65; ovrRange=8; }
  else if(score >= 73){ round='Round 2'; ovrBase=61; ovrRange=6; }
  else if(score >= 56){ round='Round 3'; ovrBase=57; ovrRange=6; }
  else if(score >= 37){ round='Rounds 4-5'; ovrBase=53; ovrRange=6; }
  else if(score >= 20){ round='Rounds 6-7'; ovrBase=49; ovrRange=5; }
  else { round='Undrafted Free Agent'; ovrBase=47; ovrRange=6; }

  S.ovr = clamp(Math.round(ovrBase + rand(0,ovrRange)), 40, 80);
  S.team = TEAMS[Math.floor(Math.random()*TEAMS.length)];
  S.fame = clamp(Math.round((round==='Round 1'?18:round==='Round 2'?10:5) + S.prepFame), 0, 100);
  S.health = clamp(90 + S.prepHealth, 0, 100);

  // Apply permanent Origin identity bonus, chosen at 16
  const ob = S.origin.bonus;
  if(ob.ovr) S.ovr = clamp(S.ovr + ob.ovr, 30, 99);
  if(ob.fame) S.fame = clamp(S.fame + ob.fame, 0, 100);
  if(ob.health) S.health = clamp(S.health + ob.health, 0, 100);
  if(ob.quimica) S.quimica = clamp(S.quimica + ob.quimica, 0, 100);
  if(ob.legacy) S.legacy += ob.legacy;
  if(ob.presion) S.presion = clamp(S.presion + ob.presion, 0, 100);
  if(ob.iq) S.iq = clamp(S.iq + ob.iq, 0, 100);
  if(ob.durability) S.durability = clamp(S.durability + ob.durability, 0, 100);
  if(ob.money) S.money = Math.round((S.money + ob.money)*10)/10;
  if(S.origin.growthMultiplier) S.growthMultiplier = S.origin.growthMultiplier;

  applyChallengeToStart();
  S.peakOvr = S.ovr;
  S.prevOvr = S.ovr;
  S.age = 21;
  S.rival = {
    name: MOCK_PROSPECT_NAMES[Math.floor(Math.random()*MOCK_PROSPECT_NAMES.length)] + '',
    ovr: S.ovr + rand(-4,5),
    teamName: TEAMS[Math.floor(Math.random()*TEAMS.length)].name,
    wins:0, losses:0,
  };
  S.streaks = {risky:0, team:0};
  S.forcedEvent = null;

  // Signing bonus in millions of USD, scaled to real NFL rookie contract ranges
  const bonusByRound = {'Round 1':22, 'Round 2':9, 'Round 3':4.5, 'Rounds 4-5':2, 'Rounds 6-7':0.9, 'Undrafted Free Agent':0.2};
  S.money = Math.round((S.money + bonusByRound[round] + rand(-1,1)) * 10) / 10;
  if(S.money < 0.1) S.money = 0.1;

  let pickNumber;
  if(round==='Round 1') pickNumber = Math.floor(rand(1,33));
  else if(round==='Round 2') pickNumber = Math.floor(rand(33,65));
  else if(round==='Round 3') pickNumber = Math.floor(rand(65,97));
  else if(round==='Rounds 4-5') pickNumber = Math.floor(rand(97,177));
  else if(round==='Rounds 6-7') pickNumber = Math.floor(rand(177,258));
  else pickNumber = 0;
  S.draftPickNumber = pickNumber;

  S.draft = { round, score:Math.round(score), collegeTag: college.tag };
  S.timeline.push({yr:'Draft', text:`Drafted in ${round} by the ${S.team.name}, ${college.tag}.`});

  generateDraftClassRivals();
  S.bigBoard = generateBigBoard();
  S.screen = 'draftcard';
  render();
}

const DRAFT_CLASS_QUALITY_TIERS = [
  {label:'a special teams player', weight:35, min:10, max:50},
  {label:'a solid starter with a role-player career', weight:30, min:50, max:90},
  {label:'a franchise icon', weight:20, min:90, max:150},
  {label:'a perennial Hall of Fame finalist', weight:12, min:150, max:205},
  {label:'an immortal legend of the league', weight:3, min:205, max:255},
];

function rollRivalOutcome(){
  const roll = Math.random()*100;
  let cum = 0;
  for(const t of DRAFT_CLASS_QUALITY_TIERS){
    cum += t.weight;
    if(roll <= cum) return { score: Math.round(rand(t.min,t.max)), label: t.label };
  }
  return { score: 80, label: 'a solid starter with a role-player career' };
}

function generateDraftClassRivals(){
  const names = shuffle(MOCK_PROSPECT_NAMES).slice(0,3);
  S.draftClassRivals = names.map(name=>{
    const outcome = rollRivalOutcome();
    return { name, position: MOCK_PROSPECT_POS[Math.floor(Math.random()*MOCK_PROSPECT_POS.length)], score: outcome.score, label: outcome.label };
  });
}

function generateBigBoard(){
  const shuffled = shuffle(MOCK_PROSPECT_NAMES);
  const board = [];
  for(let i=0;i<10;i++){
    board.push({ rank:i+1, name:shuffled[i%shuffled.length], position: MOCK_PROSPECT_POS[Math.floor(Math.random()*MOCK_PROSPECT_POS.length)], isPlayer:false });
  }
  if(S.draftPickNumber && S.draftPickNumber<=10){
    board[S.draftPickNumber-1] = { rank:S.draftPickNumber, name:S.name, position:pos().code, isPlayer:true };
  }
  return board;
}

  `).join('');
  const offBoard = !S.draftPickNumber || S.draftPickNumber > 10;
  el(`

const SAVE_KEY = 'plp_goat_save_v1_en';
function saveCareer(){
  if(!S || S.isDaily || S.year < 1 || S.retired) return;
  try{
    const copy = Object.assign({}, S, {pendingEvent:null, pendingRarities:[], pendingSeasonPhase1:null, pendingCelebration:null, pendingInjury:null, pendingFeedback:null, pendingSeasonNote:null, screen:'event'});
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:1, savedAt:Date.now(), state:copy}));
  }catch(e){}
}
function patchSave(fn){
  if(!S || S.isDaily) return;
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.state) return;
    fn(d.state);
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
  }catch(e){}
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !d.state || !d.state.posCode) return null;
    return d;
  }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function resumeCareer(){
  const d = loadSave();
  if(!d) return;
  Math.random = _nativeRandom;
  S = d.state;
  S.isDaily = false;
  refillQueue(pos());
  goToEvent();
}

function trackStreaks(fx){
  if(!S.streaks) S.streaks = {risky:0, team:0};
  const risky = (fx.health||0) <= -3 || (fx.presion||0) >= 4 || (fx.quimica||0) <= -3;
  const team = (fx.quimica||0) >= 3;
  S.streaks.risky = risky ? S.streaks.risky + 1 : 0;
  S.streaks.team = team ? S.streaks.team + 1 : 0;
  if(S.streaks.risky >= 3){ S.forcedEvent = 'scandal'; S.streaks.risky = 0; }
  else if(S.streaks.team >= 3){ S.forcedEvent = 'favor'; S.streaks.team = 0; }
}

const RARITY_DEFS = [
  {key:'normal', label:'Common', color:'#9aa7c4', mult:0.65},
  {key:'rara', label:'Rare', color:'#4f9dd6', mult:0.85},
  {key:'epica', label:'Epic', color:'#b06fe0', mult:1.05},
  {key:'unica', label:'Unique', color:'#c8102e', mult:1.3},
];

function rollRarity(){
  const r = Math.random();
  if(r < 0.58) return RARITY_DEFS[0];
  if(r < 0.85) return RARITY_DEFS[1];
  if(r < 0.97) return RARITY_DEFS[2];
  return RARITY_DEFS[3];
}

function rollRarities(count){
  return Array.from({length:count}, rollRarity);
}

function setPendingEvent(ev){
  S.pendingEvent = ev;
  S.pendingRarities = rollRarities(ev.choices.length);
}

function scaleFx(fx, mult){
  if(!fx) return fx;
  const out = {};
  Object.keys(fx).forEach(k=>{ out[k] = fx[k]*mult; });
  return out;
}

function resolveCommercialGamble(kind, deltas){
  const badOdds = kind==='heavy' ? 0.5 : (kind==='wild' ? 0.45 : 0.3);
  const isBad = Math.random() < badOdds;
  const pool = isBad ? COMMERCIAL_OUTCOMES.bad : COMMERCIAL_OUTCOMES.good;
  const outcome = pool[Math.floor(Math.random()*pool.length)];
  const mult = kind==='heavy' ? 1.4 : (kind==='wild' ? 1.25 : 1);
  const scaled = {};
  Object.keys(outcome.fx).forEach(k=>{ scaled[k] = outcome.fx[k]*mult; });
  const newDeltas = applyEffects(scaled);
  Object.keys(newDeltas).forEach(k=>{
    deltas[k] = (deltas[k]||0) + newDeltas[k];
  });
  return outcome.text;
}

function renderEvent(){
  const ev = S.pendingEvent;
  const posLabel = pos().label.toLowerCase();
  const text = ev.text(pos()).replace('{posLabel}', posLabel);
  const rarities = S.pendingRarities;
  const choices = ev.choices.map((c,i)=>{
    const rarity = rarities[i];
    return `
    <div class="choice-btn" data-idx="${i}" style="border-left:3px solid ${rarity.color};">
      <span class="rarity-badge" style="color:${rarity.color};">${rarity.label.toUpperCase()}</span>
      <span class="label">${c.label}</span>
      <div class="tags">${c.tags.map(t=>`<span class="tag ${t.t}">${t.s}</span>`).join('')}</div>
    </div>
  `;}).join('');
  el(`
    ${fieldTracker()}
    <div class="eyebrow">Season ${S.year} · Age ${S.age}</div>
    ${playerCardHtml()}
    ${seasonGoalCardHtml()}
    <div class="card ${ev.banner ? 'clasico-card' : ''}">

      <h2 class="section">Decision of the year</h2>
      <p class="lead">${text}</p>
      <div class="choices">${choices}</div>
    </div>
  `);
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = parseInt(b.dataset.idx);
      const c = ev.choices[idx];
      const rarity = rarities[idx];
      const deltas = applyEffects(scaleFx(c.fx, rarity.mult));
      let extraFeedback = '';
      if((ev.resolveType||'normal')==='normal' && !ev.banner) trackStreaks(c.fx||{});
      if(c.gamble){
        const outcome = resolveCommercialGamble(c.gamble, deltas);
        extraFeedback = ' ' + outcome;
      }
      const resolveType = ev.resolveType || 'normal';
      if(resolveType === 'normal'){
        S.pendingRiskMod = (c.riskMod||0) * rarity.mult;
        S.pendingDecisionFeedback = { text: c.feedback + extraFeedback, deltas };
        simulateSeason();
      } else if(resolveType === 'playoff'){
        const ph = S.pendingSeasonPhase1;
        const awardsMultiplier = ph.injured ? 0.35 : 1;
        const sbChance = clamp(0.08*awardsMultiplier + (c.boost||0) + (S.clutch-50)/380, 0, 0.5);
        const won = Math.random() < sbChance;
        ph.notes.push(c.feedback);
        if(won){
          setPendingEvent(pickSbMoment());
          S.screen = 'event';
          render();
        } else {
          finalizeSeason(false);
        }
      } else if(resolveType === 'sb'){
        S.pendingSeasonPhase1.notes.push(c.feedback);
        finalizeSeason(true);
      }
    });
  });
}

const STAT_LABELS = {ovr:'Overall', health:'Health', fame:'Fame', quimica:'Chemistry', presion:'Pressure', legacy:'Legacy', money:'Money', iq:'Tactical IQ', clutch:'Clutch', durability:'Durability', coachTrust:'Coach Trust'};
function effectScale(){ return 1.15 * (DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano).effectMult; }

function applyEffects(fx){
  const deltas = {};
  if(!fx) return deltas;
  if(fx.ovr){
    const growth = fx.ovr > 0 ? (S.growthMultiplier||1) : 1;
    const before=S.ovr; S.ovr = clamp(S.ovr + fx.ovr*effectScale()*growth + rand(-2.5,3.5), 25, 99); deltas.ovr = Math.round(S.ovr-before);
  }
  if(fx.health){ const before=S.health; S.health = clamp(S.health + fx.health*effectScale() + rand(-2,2), 0, 100); deltas.health = Math.round(S.health-before); }
  if(fx.fame){ const before=S.fame; S.fame = clamp(S.fame + fx.fame*effectScale() + rand(-1.5,1.5), 0, 100); deltas.fame = Math.round(S.fame-before); }
  if(fx.quimica){ const before=S.quimica; S.quimica = clamp(S.quimica + fx.quimica*effectScale() + rand(-1.5,1.5), 0, 100); deltas.quimica = Math.round(S.quimica-before); }
  if(fx.presion){ const before=S.presion; S.presion = clamp(S.presion + fx.presion*effectScale() + rand(-1.5,1.5), 0, 100); deltas.presion = Math.round(S.presion-before); }
  if(fx.iq){ const before=S.iq; S.iq = clamp(S.iq + fx.iq*effectScale(), 0, 100); deltas.iq = Math.round(S.iq-before); }
  if(fx.clutch){ const before=S.clutch; S.clutch = clamp(S.clutch + fx.clutch*effectScale(), 0, 100); deltas.clutch = Math.round(S.clutch-before); }
  if(fx.durability){ const before=S.durability; S.durability = clamp(S.durability + fx.durability*effectScale(), 0, 100); deltas.durability = Math.round(S.durability-before); }
  if(fx.coachTrust){ const before=S.coachTrust; S.coachTrust = clamp(S.coachTrust + fx.coachTrust*effectScale(), 0, 100); deltas.coachTrust = Math.round(S.coachTrust-before); }
  if(fx.legacy){ const scaled = Math.round(fx.legacy*1.4); S.legacy += scaled; deltas.legacy = scaled; }
  if(fx.money){ const scaled = Math.round(fx.money*10)/10; S.money = Math.round((S.money+scaled)*10)/10; deltas.money = scaled; }
  S.peakOvr = Math.max(S.peakOvr, S.ovr);
  return deltas;
}

function deltaChipsHtml(deltas){
  const chips = Object.keys(deltas).map(k=>{
    const v = deltas[k];
    if(!v) return '';
    const cls = v > 0 ? 'pos' : 'neg';
    const sign = v > 0 ? '+' : '';
    const display = k === 'money' ? `${sign}$${v}M` : `${sign}${v}`;
    return `<div class="delta-chip ${cls}">${STAT_LABELS[k]} ${display}</div>`;
  }).join('');
  return chips || '<div class="delta-chip">No immediate changes</div>';
}

function computeSeasonStats(gp){
  const ovrFactor = S.ovr/70;
  const code = pos().code;
  let stats = {};
  if(code==='QB'){
    stats = {
      'Passing Yards': Math.max(0,Math.round(gp*215*ovrFactor + rand(-400,400))),
      'Passing Touchdowns': Math.max(0,Math.round(gp*1.6*ovrFactor + rand(-3,5))),
      'Interceptions': Math.max(0,Math.round(gp*0.5/ovrFactor + rand(-2,3))),
    };
  } else if(code==='RB'){
    stats = {
      'Rushing Yards': Math.max(0,Math.round(gp*68*ovrFactor + rand(-200,200))),
      'Touchdowns': Math.max(0,Math.round(gp*0.5*ovrFactor + rand(-2,4))),
      'Carries': Math.max(0,Math.round(gp*14*ovrFactor)),
    };
  } else if(code==='WR' || code==='TE'){
    stats = {
      'Receptions': Math.max(0,Math.round(gp*4*ovrFactor + rand(-10,10))),
      'Receiving Yards': Math.max(0,Math.round(gp*54*ovrFactor + rand(-150,150))),
      'Touchdowns': Math.max(0,Math.round(gp*0.4*ovrFactor + rand(-1,3))),
    };
  } else if(code==='OL'){
    stats = {
      'Pancakes': Math.max(0,Math.round(gp*2*ovrFactor + rand(-5,10))),
      'Sacks Allowed': Math.max(0,Math.round(gp*0.3/ovrFactor + rand(-1,2))),
    };
  } else if(code==='DL' || code==='LB'){
    stats = {
      'Tackles': Math.max(0,Math.round(gp*4*ovrFactor + rand(-10,15))),
      'Sacks': Math.max(0,Math.round(gp*0.4*ovrFactor + rand(-1,3))),
    };
  } else if(code==='CB' || code==='S'){
    stats = {
      'Tackles': Math.max(0,Math.round(gp*3*ovrFactor + rand(-8,10))),
      'Interceptions': Math.max(0,Math.round(gp*0.15*ovrFactor + rand(-1,2))),
    };
  } else if(code==='K'){
    stats = {
      'Field Goals': Math.max(0,Math.round(gp*1.3*ovrFactor + rand(-3,5))),
      'Accuracy %': clamp(Math.round(70+ovrFactor*15+rand(-5,5)),50,99),
    };
  }
  return stats;
}

function accumulateCareerStats(seasonStats){
  const prevCount = S.seasonsPlayed;
  Object.keys(seasonStats).forEach(k=>{
    if(k.includes('%')){
      S.careerStats[k] = (S.careerStats[k]===undefined) ? seasonStats[k] : Math.round((S.careerStats[k]*prevCount + seasonStats[k])/(prevCount+1));
    } else {
      S.careerStats[k] = (S.careerStats[k]||0) + seasonStats[k];
    }
  });
}

function simulateSeason(){
  const p = pos();
  const ovrBeforeSeason = S.ovr;

  const ageFactor = S.age > 27 ? 0.085 : 0;
  const healthFactor = (1 - S.health/130);
  const durabilityReduction = (S.durability-50)/700 + (S.ownedItems.physio ? 0.04 : 0);
  const diffPreset = DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano;
  const injChance = clamp((p.risk * healthFactor + ageFactor + (S.pendingRiskMod||0) - durabilityReduction) * diffPreset.injuryMult, 0.02, 0.65);

  if(Math.random() < injChance){
    const sev = rand(8,32);
    const type = sev > 24 ? INJURY_TYPES[2] : (Math.random()<0.35 ? INJURY_TYPES[0] : INJURY_TYPES[1]);
    S.pendingInjury = { type, sev, ovrBeforeSeason };
    S.screen = 'injurymoment';
    render();
  } else {
    continueSeasonAfterInjury(17, [], false, ovrBeforeSeason);
  }
}

function continueSeasonAfterInjury(gamesPlayed, priorNotes, injured, ovrBeforeSeason){
  let notes = priorNotes.slice();
  const diffPreset = DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano;

  // Team performance — chemistry and team quality add a real boost, wider random swing for variety
  const teamStrength = S.ovr + rand(-16,16) + (S.quimica-50)/5 + (S.teamQuality||0) - 6;
  const winPct = clamp(teamStrength/138, 0.07, 0.8);
  const wins = Math.round(winPct*17);

  // Division race — strong teams contend, chemistry tips close races
  let divisionChamp = false;
  if(wins >= 8){
    const divChance = clamp(((wins-8)*0.1 + (S.quimica-50)/320) * diffPreset.awardsMult, 0.02, 0.7);
    divisionChamp = Math.random() < divChance;
  }
  const playoffs = divisionChamp || wins >= 11 || (wins===10 && Math.random()<0.5) || (wins===9 && Math.random()<0.25);

  // Awards — media pressure and IQ affect consistency, chemistry and fame help
  let awardsMultiplier = injured ? 0.6 : 1;
  const pbChance = clamp(((S.ovr-64)/105 + S.fame/480 + (S.quimica-50)/600 + (S.iq-50)/550 - S.presion/380) * awardsMultiplier * diffPreset.awardsMult, 0, 0.42);
  let madeProBowl = false, madeAllPro = false, madeMVP = false;
  if(Math.random() < pbChance){
    madeProBowl = true;
    S.proBowls++;
    S.legacy += 6;
    S.fame = clamp(S.fame+5,0,100);
    notes.push(`You were selected to the Pro Bowl.`);
    S.proBowlStreak = (S.proBowlStreak||0) + 1;
    S.bestProBowlStreak = Math.max(S.bestProBowlStreak||0, S.proBowlStreak);
    if(S.proBowlStreak >= 3){
      S.legacy += 3;
      notes.push(`You made it to your Pro Bowl number ${S.proBowlStreak} in a row — a golden streak.`);
    }
    if(Math.random() < 0.42){
      madeAllPro = true;
      S.allPro++;
      S.legacy += 10;
      notes.push(`You were also named All-Pro.`);
      if(S.ovr >= 88 && Math.random() < 0.2){
        madeMVP = true;
        S.mvps++;
        S.legacy += 15;
        S.fame = clamp(S.fame+10,0,100);
        notes.push(`And you were crowned season MVP!`);
      }
    }
  } else {
    S.proBowlStreak = 0;
  }
  if(divisionChamp){
    S.divisionTitles++;
    S.legacy += 7;
    notes.push(`You were Division Champion with the ${S.team.name}.`);
  }

  // Coaching stability check every 5 seasons
  if(S.year % 5 === 0){
    if(S.coachTrust < 40 && Math.random() < 0.6){
      notes.push(`The head coach was fired after a poor run of seasons. A new scheme arrives and you have to earn trust from scratch.`);
      S.coachTrust = 55;
      S.quimica = clamp(S.quimica-10, 0, 100);
      S.presion = clamp(S.presion+10, 0, 100);
    }
  }

  // Position-specific stats for the season
  const seasonStats = computeSeasonStats(gamesPlayed);
  accumulateCareerStats(seasonStats);

  // Money income (boosted if your Agent strategy prioritizes maximizing money, or you own a Super Agent)
  const agentBoost = (S.agentStrategy === 'money' ? 1.3 : 1) * (S.ownedItems.agent ? 1.25 : 1);
  const moneyGain = Math.round((S.ovr/14 + S.fame/28 + rand(0,1.6)) * agentBoost * 10)/10;
  S.money = Math.round((S.money + moneyGain)*10)/10;
  notes.push(`You earned $${moneyGain}M USD this season.`);

  // Earn a skill point for completing the season
  S.skillPoints++;

  S.pendingSeasonPhase1 = { notes, wins, playoffs, divisionChamp, madeProBowl, madeAllPro, madeMVP, injured, seasonStats, ovrBeforeSeason };

  if(playoffs){
    setPendingEvent(pickPlayoffMoment());
    S.screen = 'event';
    render();
  } else {
    finalizeSeason(false);
  }
}

function finalizeSeason(wonSuperBowl){
  const ph = S.pendingSeasonPhase1;
  let notes = ph.notes;

  if(wonSuperBowl){
    S.rings++;
    S.legacy += 25;
    S.fame = clamp(S.fame+18,0,100);
    notes.push(`You won the Super Bowl with the ${S.team.name}!`);
  } else if(ph.playoffs){
    notes.push(`The ${S.team.name} fell short in the playoffs, finishing ${ph.wins}-${17-ph.wins}.`);
  } else {
    notes.push(`The ${S.team.name} finished the season ${ph.wins}-${17-ph.wins}, missing the playoffs.`);
  }

  // Presión decays a bit each year if not reinforced (faster with a sports psychologist); chemistry drifts toward 55
  S.presion = clamp(S.presion - (5 + (S.ownedItems.psych ? 3 : 0)), 0, 100);
  S.quimica = clamp(S.quimica + (55 - S.quimica) * 0.08, 0, 100);

  // Passive health drift tied to Durability (and a personal chef): resilient bodies recover, fragile ones wear down
  S.health = clamp(S.health + (S.durability-50)/20 + (S.ownedItems.cook ? 2 : 0), 0, 100);

  // Age decline (delayed by higher Durability, and further by a dedicated trainer)
  const durabilityDelay = Math.round((S.durability-50)/15) + (S.ownedItems.trainer ? 2 : 0);
  if(S.age >= 29+durabilityDelay){
    S.ovr = clamp(S.ovr - rand(1.5, 3 + (S.age-29-durabilityDelay)*0.35), 30, 99);
  }
  if(S.age >= 31+durabilityDelay){
    S.health = clamp(S.health - 4, 0, 100);
  }

  S.peakOvr = Math.max(S.peakOvr, S.ovr);
  S.seasonsPlayed++;
  S.ovrHistory.push({ year: S.year, ovr: Math.round(S.ovr) });
  S.timeline.push({yr:`Year ${S.year}`, text: notes.join(' ')});

  if(S.seasonGoal && S.seasonGoal.year === S.year){
    const gdef = SEASON_GOALS[S.seasonGoal.key];
    const ok = !!gdef.check({playoffs:ph.playoffs, wins:ph.wins, injured:ph.injured, madeProBowl:ph.madeProBowl, divisionChamp:ph.divisionChamp, madeAllPro:ph.madeAllPro, superbowl:wonSuperBowl});
    if(ok){
      applyGoalReward(gdef.reward);
      S.goalsMet = (S.goalsMet||0) + 1;
      notes.push(`Goal met: ${gdef.text.toLowerCase()}. (${rewardLabel(gdef.reward)})`);
    } else {
      notes.push(`Goal missed: ${gdef.text.toLowerCase()}.`);
    }
  }
  if(S.rival){
    const rv = S.rival;
    rv.ovr = clamp(rv.ovr + (S.year<=6 ? rand(0.5,3.2) : rand(-2.2,1)), 40, 95);
    const mine = Math.round(S.ovr), theirs = Math.round(rv.ovr);
    if(mine >= theirs){ rv.wins++; S.fame = clamp(S.fame+1,0,100); }
    else { rv.losses++; }
    notes.push(`Rivalry with ${rv.name} (${rv.teamName}): you ${mine} vs ${theirs}. ${mine>=theirs?'This season you win the comparison':'This season they win the comparison'} (${rv.wins}-${rv.losses}).`);
  }
  S.pendingSeasonNote = { notes, wins:ph.wins, playoffs:ph.playoffs, divisionChamp:ph.divisionChamp, madeProBowl:ph.madeProBowl, madeAllPro:ph.madeAllPro, madeMVP:ph.madeMVP, wonSuperBowl, injured:ph.injured, decisionFeedback: S.pendingDecisionFeedback, seasonStats: ph.seasonStats };
  S.pendingDecisionFeedback = null;
  S.prevOvr = ph.ovrBeforeSeason;

  if(wonSuperBowl || ph.madeMVP){
    S.pendingCelebration = wonSuperBowl ? 'superbowl' : 'mvp';
    S.screen = 'celebration';
  } else {
    S.screen = 'seasonresult';
  }
  render();
}

function seasonHeadline(r){
  let tier;
  if(r.wonSuperBowl) tier='superbowl';
  else if(r.divisionChamp || r.madeAllPro) tier='great';
  else if(r.madeProBowl) tier='good';
  else if(r.injured) tier='injury';
  else if(r.playoffs) tier='decent';
  else tier='mediocre';
  const pool = SEASON_HEADLINES[tier];
  return pool[Math.floor(Math.random()*pool.length)];
}

function iconForNote(note){
  if(note.startsWith('Goal ')) return '🎯';
  if(note.startsWith('Rivalry')) return '⚔️';
  if(note.includes('injury')) return '🩹';
  if(note.includes('archrival')) return '⚔️';
  if(note.includes('Pro Bowl') || note.includes('All-Pro')) return '⭐';
  if(note.includes('Division Champion')) return '🎖️';
  if(note.includes('Super Bowl')) return '🏆';
  if(note.includes('playoffs') || note.includes('record')) return '📊';
  return '📋';
}

function animateCountUp(){
  document.querySelectorAll('.statbar .v').forEach(elm=>{
    const target = parseFloat(elm.textContent);
    if(isNaN(target)) return;
    const duration = 650;
    const startTime = performance.now();
    function step(now){
      const p = Math.min((now-startTime)/duration, 1);
      const val = Math.round(target*p);
      elm.textContent = val;
      if(p<1) requestAnimationFrame(step);
      else elm.textContent = target;
    }
    requestAnimationFrame(step);
  });
}

const CONTENDER_TEAMS = ["Dallas Cowboys","Green Bay Packers","Kansas City Chiefs","San Francisco 49ers","Philadelphia Eagles","Buffalo Bills"];
const REBUILDING_TEAMS = ["Jacksonville Jaguars","Carolina Panthers","New York Giants","Las Vegas Raiders","Chicago Bears","Tennessee Titans"];

const OFFER_QUOTES = [
  "They offer you the captain's patch within a year.",
  "Touchdown bonus written into the contract.",
  "Promise of an undisputed starting job from day one.",
  "They want you as the new face of the franchise.",
];

function renderContract(){
  const contenderTeam = TEAMS.find(t=>t.name === CONTENDER_TEAMS[Math.floor(Math.random()*CONTENDER_TEAMS.length)]) || TEAMS[Math.floor(Math.random()*TEAMS.length)];
  const rebuildingTeam = TEAMS.find(t=>t.name === REBUILDING_TEAMS[Math.floor(Math.random()*REBUILDING_TEAMS.length)]) || TEAMS[Math.floor(Math.random()*TEAMS.length)];
  const randomPool = TEAMS.filter(t=>t.name!==S.team.name && t.name!==contenderTeam.name && t.name!==rebuildingTeam.name);
  const randomTeam = shuffle(randomPool)[0];
  const agentSalaryBoost = S.agentStrategy === 'money' ? 1.3 : 1;
  const base = (S.ovr-40)*0.55 + S.fame*0.15;

  function makeOffer(team, type){
    let salary, badge;
    if(type==='contender'){
      salary = Math.max(2, Math.round((base*0.7 + rand(-1,3))*10)/10);
      badge = 'CONTENDER';
    } else if(type==='rebuilding'){
      salary = Math.max(2, Math.round((base*1.45 + rand(2,10)) * agentSalaryBoost *10)/10);
      badge = 'REBUILDING';
    } else {
      salary = Math.max(2, Math.round((base + rand(-2,6)) * agentSalaryBoost *10)/10);
      badge = Math.random()<0.3 ? 'BLOCKBUSTER' : null;
    }
    const bonus = Math.round(salary*0.35*10)/10;
    const noTrade = Math.random() < 0.4;
    return { team, type, salary, bonus, noTrade, years: Math.floor(rand(2,5)), quote: OFFER_QUOTES[Math.floor(Math.random()*OFFER_QUOTES.length)], badge };
  }

  const offers = [makeOffer(contenderTeam,'contender'), makeOffer(rebuildingTeam,'rebuilding'), makeOffer(randomTeam,'balanced')];
  const renewalSalary = Math.max(2, Math.round((base*0.9 + rand(-1,4)) * agentSalaryBoost *10)/10);
  const renewalBonus = Math.round(renewalSalary*0.3*10)/10;

  const renewalCard = `
    <div class="offer-card" data-c="extend">

  `);
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const p = b.dataset.p;
      let finalSalary, deltas, feedbackText;
      if(p==='conciliador'){
        finalSalary = Math.round(salary*0.9*10)/10;
        deltas = applyEffects({legacy:5, fame:-3, quimica:8, money:bonus});
        feedbackText = `You accepted the deal without a fight: $${finalSalary}M per year. The franchise values your loyalty, though you left some money on the table.`;
      } else if(p==='equilibrado'){
        finalSalary = Math.round(salary*1.05*10)/10;
        deltas = applyEffects({legacy:6, fame:-2, quimica:5, money:bonus});
        feedbackText = `You negotiated a small, reasonable adjustment: you closed at $${finalSalary}M per year. Both sides left the table satisfied.`;
      } else {
        const won = Math.random() < 0.5;
        if(won){
          finalSalary = Math.round(salary*1.35*10)/10;
          deltas = applyEffects({legacy:4, fame:5, money:Math.round(bonus*1.4*10)/10});
          feedbackText = `The GM gave in. You got the record contract you were after: $${finalSalary}M per year.`;
        } else {
          finalSalary = Math.round(salary*0.75*10)/10;
          deltas = applyEffects({quimica:-8, presion:5, money:Math.round(bonus*0.6*10)/10});
          feedbackText = `The GM took offense at your aggressive stance and you ended up signing for less than expected: $${finalSalary}M per year.`;
        }
      }
      S.timeline.push({yr:`Year ${S.year}`, text: feedbackText});
      S.pendingFeedback = { text: feedbackText, deltas };
      S.afterFeedback = 'retirement';
      S.screen = 'feedback';
      render();
    });
  });
}

function checkRetirement(){
  const forcedRetire = S.age >= 40 || S.ovr <= 33;
  const offerRetire = S.age >= 33 || (S.ovr < 46 && S.age >= 27) || S.health < 25;

  if(forcedRetire){
    endCareer("The organization decided not to renew you. Your body and your level can't take any more.");
    return;
  }
  if(offerRetire){
    S.screen = 'retireprompt';
    render();
    return;
  }
  goToEvent();
}

const SKILL_MAX_LEVEL = 5;

function renderShop(){
  const tree = SKILL_TREES[pos().code];
  const rows = tree.map(node=>{
    const level = S.skills[node.key] || 0;
    const maxed = level >= SKILL_MAX_LEVEL;
    const canAfford = S.skillPoints > 0 && !maxed;
    return `
    <div class="shop-item ${maxed?'owned':''}" data-key="${node.key}">
      <div class="shop-icon">${node.icon}</div>
      <div class="shop-info">
        <div class="shop-name">${node.name} <span class="sub">· Level ${level}/${SKILL_MAX_LEVEL}</span></div>
        <p class="sub" style="margin:2px 0 0;">${node.desc}</p>
      </div>
      <button class="skill-btn" data-key="${node.key}" ${canAfford?'':'disabled'}>${maxed?'MAX':'+1'}</button>
    </div>`;
  }).join('');

  el(`
    <div class="eyebrow">🌳 Skill Tree</div>
    <h1 class="display">Specific Training</h1>
    <div class="card">
      <div class="money-line" style="margin-bottom:16px;">
        <span class="money-amount">${S.skillPoints} skill points available</span>
      </div>
      <p class="sub" style="margin-bottom:14px;">You earn 1 skill point for every full season. Invest your points in whatever defines your playing style as a ${pos().label}.</p>
      <div class="shop-grid">${rows}</div>
      <button class="btn" id="backBtn" style="width:100%; margin-top:16px;">← Back</button>
    </div>
  `);
  document.querySelectorAll('.skill-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      const node = tree.find(n=>n.key===b.dataset.key);
      const level = S.skills[node.key] || 0;
      if(level >= SKILL_MAX_LEVEL || S.skillPoints <= 0) return;
      S.skillPoints--;
      S.skills[node.key] = level+1;
      Object.keys(node.effect).forEach(k=>{
        if(k==='ovr') S.ovr = clamp(S.ovr + node.effect.ovr, 30, 99);
        else if(k==='iq') S.iq = clamp(S.iq + node.effect.iq, 0, 100);
        else if(k==='clutch') S.clutch = clamp(S.clutch + node.effect.clutch, 0, 100);
        else if(k==='durability') S.durability = clamp(S.durability + node.effect.durability, 0, 100);
      });
      S.peakOvr = Math.max(S.peakOvr, S.ovr);
      patchSave(st=>{
        st.skillPoints = Math.max(0, (st.skillPoints||0) - 1);
        st.skills = st.skills || {};
        st.skills[node.key] = (st.skills[node.key]||0) + 1;
        Object.keys(node.effect).forEach(k=>{
          if(k==='ovr') st.ovr = clamp((st.ovr||0) + node.effect.ovr, 30, 99);
          else if(k==='iq') st.iq = clamp((st.iq||0) + node.effect.iq, 0, 100);
          else if(k==='clutch') st.clutch = clamp((st.clutch||0) + node.effect.clutch, 0, 100);
          else if(k==='durability') st.durability = clamp((st.durability||0) + node.effect.durability, 0, 100);
        });
        st.peakOvr = Math.max(st.peakOvr||0, st.ovr||0);
      });
      render();
    });
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{
    S.screen = S.returnScreen || 'seasonresult';
    render();
  });
}

const ACH_KEY = 'plp_goat_achievements_v1_en';
function loadUnlocked(){
  try{ return JSON.parse(localStorage.getItem(ACH_KEY)) || []; }catch(e){ return []; }
}
function saveUnlocked(keys){
  try{
    const cur = new Set(loadUnlocked());
    keys.forEach(k=>cur.add(k));
    localStorage.setItem(ACH_KEY, JSON.stringify([...cur]));
  }catch(e){}
}
function badgesHtml(){
  const got = new Set(loadUnlocked());
  const items = ACHIEVEMENTS_DEFS.map(a=>`
    <div class="badge-item ${got.has(a.key)?'unlocked':''}" title="${a.hint}">
      <div class="badge-icon">${got.has(a.key) ? a.icon : '🔒'}</div>
      <div class="badge-name">${a.name}</div>
      <div class="badge-hint">${a.hint}</div>
    </div>`).join('');
  return `
    <details class="badges-box">
      <summary>🏅 Badges (${got.size}/${ACHIEVEMENTS_DEFS.length})</summary>
      <div class="badge-grid">${items}</div>
    </details>`;
}

function endCareer(closingLine){
  S.retired = true;
  const hofMult = (DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano).hofMult;
  const score = Math.round(
    (S.legacy + S.rings*15 + S.mvps*12 + S.proBowls*4 + S.allPro*7 + S.divisionTitles*3 + S.peakOvr*0.5 + S.seasonsPlayed*1.5) / hofMult
  );
  let tier, tierDesc;
  if(score >= 210){
    tier = "You earned the statue";
    tierDesc = "First-ballot Hall of Fame, no debate. Your statue will stand outside the stadium forever.";
  } else if(score >= 155){
    tier = "One vote from the statue";
    tierDesc = "A perennial Hall of Fame finalist. Your career sparks debate every year in the voting — sooner or later, you get in.";
  } else if(score >= 105){
    tier = "Franchise Icon";
    tierDesc = "You didn't make it to the statue, but your name will always be in your team's history.";
  } else if(score >= 65){
    tier = "Solid Starter, Role-Player Career";
    tierDesc = "A respectable career as a reliable professional, without the exposure of a star.";
  } else {
    tier = "Roster / Special Teams Player";
    tierDesc = "Your career was short or low-key, but you played in the NFL — something almost nobody achieves.";
  }
  S.finalScore = score;
  S.finalTier = tier;
  S.finalTierDesc = tierDesc;
  S.closingLine = closingLine;
  S.achievements = ACHIEVEMENTS_DEFS.filter(a=>{ try{ return a.test(); }catch(e){ return false; } });
  if(!S.isDaily) saveUnlocked(S.achievements.map(a=>a.key));
  S.screen = 'retirementceremony';
  render();
}

function computeEnding(){
  const pc = S.postCareerPath ? S.postCareerPath.key : null;
  if(S.everSeverelyInjured && S.seasonsPlayed <= 7)
    return {icon:'🩹', title:'The Interrupted Legend', text:`A serious injury took the best of your career. No one knows how far you could have gone, but ${S.team.name} fans still say your best year never came.`};
  if(S.rings >= 3)
    return {icon:'👑', title:'The Dynasty', text:`${S.rings} rings and an entire era with your name on it. When people talk about the best years of the ${S.team.name}, they'll be talking about yours.`};
  if(S.rings >= 1 && S.mvps >= 1)
    return {icon:'🏆', title:'Champion and Face of the League', text:`Ring on your finger and the MVP in the trophy case. You were the player everyone wanted to be and the one everyone wanted to have.`};
  if(S.proBowls >= 6 && S.rings === 0)
    return {icon:'💔', title:'The Best Without a Ring', text:`Six or more Pro Bowls and all the respect of the league... but the Lombardi Trophy never came. The debates about your legacy will return every February.`};
  if(S.seasonsPlayed >= 10 && S.proBowls === 0 && S.iq >= 55)
    return {icon:'📋', title:'The Eternal Backup', text: pc==='coach'
      ? `You were never the star, but you saw it all from the bench. Now, clipboard in hand, young players learn from the one who understands the game best.`
      : `You were never the star, but your brain and your consistency gave you more than a decade in the league. Coaches always wanted you close.`};
  if((S.teamChangesCount||0) >= 3)
    return {icon:'✈️', title:'The Traveling Mercenary', text:`Four uniforms or more. You went where the contract and the challenge took you, and in every locker room you left a story.`};
  if((S.teamChangesCount||0) === 0 && S.seasonsPlayed >= 9)
    return {icon:'🛡️', title:'One Shield', text:`Your entire career with the ${S.team.name}. In an age of free agents and trades, your loyalty became legend.`};
  if(S.fame >= 80 && S.money >= 100)
    return {icon:'📺', title:'The Media Star', text:`Your brand was worth as much as your game: endorsements, magazine covers, and millions of followers. You were a phenomenon on and off the field.`};
  return {icon:'🏈', title:'A Career Worth Respecting', text:`With ups and downs, wins and losses, you wrote your own chapter in the NFL. Few can say they played ${S.seasonsPlayed} seasons there.`};
}

function computeNickname(){
  const cands = [
    {v:S.clutch, n:'The Ice Man'},
    {v:S.iq, n:'The Professor'},
    {v:S.durability, n:'The Oak'},
    {v:S.fame, n:'The Superstar'},
    {v:S.quimica, n:'The Locker Room Captain'},
    {v:Math.min(100, S.peakOvr), n:'The Prodigy'},
  ];
  const best = cands.sort((a,b)=>b.v-a.v)[0];
  return best.v >= 68 ? best.n : 'The Workhorse';
}

function finalizeEndScreen(){
  S.nickname = computeNickname();
  S.ending = computeEnding();
  saveHistoryEntry({
    name: S.name, position: pos().label, number: S.jerseyNumber, team: S.team.name,
    teamAbbr: S.team.abbr, teamC1: S.team.c1, teamC2: S.team.c2,
    tier: S.finalTier, score: S.finalScore, seasons: S.seasonsPlayed, rings: S.rings,
    date: new Date().toISOString().slice(0,10),
  });
  S.screen = 'end';
  render();
}

function ovrEvolutionSvg(){
  const data = S.ovrHistory;
  if(!data || data.length < 2) return '<p class="sub">There weren\'t enough seasons to chart your progression.</p>';
  const w=600, h=180, padL=30, padR=14, padT=16, padB=28;
  const maxOvr = Math.max(...data.map(d=>d.ovr), 70)+3;
  const minOvr = Math.min(...data.map(d=>d.ovr), 50)-3;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const stepX = data.length>1 ? innerW/(data.length-1) : 0;
  const pts = data.map((d,i)=>({
    x: padL + i*stepX,
    y: padT + innerH - ((d.ovr-minOvr)/(maxOvr-minOvr))*innerH,
    ovr:d.ovr, year:d.year
  }));
  const linePoints = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPoints = `${padL},${padT+innerH} ${linePoints} ${pts[pts.length-1].x.toFixed(1)},${padT+innerH}`;
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--gold)" stroke="#0c1836" stroke-width="1.5"/>`).join('');
  const gridLines = [0,0.5,1].map(f=>`<line x1="${padL}" y1="${padT+innerH*f}" x2="${w-padR}" y2="${padT+innerH*f}" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`).join('');
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">
    <defs>
      <linearGradient id="ovrfade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c8102e"/>
        <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridLines}
    <polygon points="${areaPoints}" fill="url(#ovrfade)" opacity="0.3"/>
    <polyline points="${linePoints}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${padL}" y="${h-6}" font-size="10" fill="#9aa7c4" font-family="Oswald">Year ${pts[0].year}</text>
    <text x="${w-padR}" y="${h-6}" font-size="10" fill="#9aa7c4" font-family="Oswald" text-anchor="end">Year ${pts[pts.length-1].year}</text>
  </svg>`;
}

function draftClassComparisonHtml(){
  if(!S.draftClassRivals || !S.draftClassRivals.length) return '';
  let winCount = 0;
  const lines = S.draftClassRivals.map(r=>{
    const beat = S.finalScore > r.score;
    if(beat) winCount++;
    const verb = S.finalScore===r.score ? 'You tied with' : (beat ? 'You outdid' : 'You finished behind');
    return `<div class="bullet"><span class="b-icon">${beat?'✅':'⬜'}</span><span>${verb} <b>${r.name}</b> (${r.position}), who finished their career as ${r.label}.</span></div>`;
  }).join('');
  return `
    <div class="divider"></div>
    <h2 class="section">Your Draft Class</h2>
    <p class="sub" style="margin-bottom:10px;">You beat ${winCount} of ${S.draftClassRivals.length} players from your own class.</p>
    <div class="bullet-list">${lines}</div>
  `;
}

function playstyleLabel(){
  if(S.rings>=2 && S.clutch>=65) return "The Relentless Closer — you shine brightest when the game is on the line.";
  if(S.mvps>=1) return "The Individual Phenom — the whole league rarely agrees on anything, and one of those times was about you.";
  if(S.iq>=70 && S.clutch<60) return "The Silent Strategist — you win with your head more than with the show.";
  if(S.durability>=75 && S.seasonsPlayed>=12) return "The Iron Man — durability was your superpower.";
  if(S.divisionTitles>=3 && S.rings===0) return "The Almost Champion — you built winners, but the ring held out.";
  if(S.fame>=80) return "The Media Star — your name sold tickets as much as your plays did.";
  return "The Consistent Professional — a solid career, brick by brick.";
}
