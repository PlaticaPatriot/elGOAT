<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070f">
<title>Camino a Canton — Simulador de Carrera NFL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --turf-dark:#05070f;
  --turf:#0b1730;
  --turf-line:#1f3363;
  --panel:#080f24;
  --chalk:#f2f3f5;
  --chalk-dim:#9aa7c4;
  --gold:#c8102e;
  --gold-dim:#7a0a1f;
  --danger:#d9772e;
  --info:#6f8fb0;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 2px, transparent 2px, transparent 110px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 90px),
    radial-gradient(circle at 15% 8%, rgba(200,16,46,.10), transparent 38%),
    radial-gradient(circle at 85% 6%, rgba(111,143,176,.09), transparent 38%),
    radial-gradient(circle at 50% 100%, rgba(200,16,46,.06), transparent 45%),
    radial-gradient(ellipse at top, #16265a 0%, var(--turf-dark) 55%);
  background-attachment: fixed;
  color:var(--chalk);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding:0;
}
#app{
  max-width:780px;
  margin:0 auto;
  padding:18px 16px 60px;
  position:relative;
}

/* ---- Site header / brand ---- */
.site-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:1px solid var(--turf-line);
}
.site-header img{
  width:46px; height:46px;
  border-radius:50%;
  border:2px solid var(--gold-dim);
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.site-header .brand{
  font-family:'Bebas Neue',sans-serif;
  font-size:19px;
  letter-spacing:2px;
  color:var(--chalk);
  line-height:1.1;
  flex:1;
  min-width:0;
}
.header-donate-btn{
  flex-shrink:0;
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  background:rgba(215,173,63,.12);
  border:1px solid var(--gold-dim);
  font-size:16px;
  text-decoration:none;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease;
}
.header-donate-btn:hover{ transform:scale(1.08); background:rgba(200,16,46,.2); }
.site-header .brand small{
  display:block;
  font-family:'Oswald',sans-serif;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:600;
  margin-top:2px;
}

/* ---- Field tracker (signature element) ---- */
.field-tracker{
  position:relative;
  height:34px;
  border-radius:6px;
  background:repeating-linear-gradient(90deg, #142a5c 0 40px, #0e2049 40px 80px);
  border:1px solid var(--turf-line);
  overflow:hidden;
  margin-bottom:18px;
}
.field-tracker .zone-label{
  position:absolute;
  top:0; bottom:0;
  display:flex;
  align-items:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:13px;
  letter-spacing:2px;
  color:var(--chalk-dim);
  padding:0 10px;
}
.field-tracker .zone-label.start{left:0;}
.field-tracker .zone-label.end{right:0; color:var(--gold); font-weight:600;}
.field-tracker .marker{
  position:absolute;
  top:2px; bottom:2px;
  width:3px;
  background:var(--gold);
  box-shadow:0 0 8px var(--gold);
  border-radius:2px;
  transition:left .5s ease;
}

/* ---- Layout blocks ---- */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 45%), var(--panel);
  border:1px solid var(--turf-line);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, transparent, var(--gold) 30%, #ff3b5c 70%, transparent);
  opacity:.85;
}
h1.display{
  font-family:'Anton',sans-serif;
  font-size:clamp(32px,8.5vw,50px);
  letter-spacing:.5px;
  text-transform:uppercase;
  color:var(--chalk);
  margin:0 0 6px;
  line-height:1.02;
  text-shadow:
    1px 1px 0 var(--gold-dim),
    2px 2px 0 var(--gold-dim),
    3px 3px 0 #4a0713,
    4px 5px 8px rgba(0,0,0,.6);
}
h1.display span{color:var(--gold); text-shadow:1px 1px 0 var(--gold-dim), 2px 2px 0 #4a0713, 3px 4px 8px rgba(0,0,0,.6), 0 0 26px rgba(200,16,46,.55);}
.text-3d{
  text-shadow:
    1px 1px 0 var(--gold-dim),
    2px 2px 0 var(--gold-dim),
    3px 3px 0 #4a0713,
    4px 5px 10px rgba(0,0,0,.65);
}
.eyebrow{
  font-family:'Bebas Neue',sans-serif;
  font-size:15px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 6px;
  position:relative;
  display:inline-block;
}
.eyebrow::after{
  content:'';
  display:block;
  width:36px; height:3px;
  background:linear-gradient(90deg, var(--gold), #ff3b5c);
  margin-top:6px;
  border-radius:2px;
  box-shadow:0 0 8px rgba(200,16,46,.6);
}
h2.section{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:.4px;
  text-transform:uppercase;
  margin:0 0 12px;
  color:var(--chalk);
}
p.lead{color:var(--chalk-dim); line-height:1.55; margin:0 0 16px; font-size:15px;}
.sub{color:var(--chalk-dim); font-size:13px; line-height:1.5;}

/* ---- Team badge ---- */
.team-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:44px; height:44px;
  border-radius:50%;
  font-family:'Bebas Neue',sans-serif;
  font-size:14px;
  letter-spacing:.5px;
  flex-shrink:0;
  border:2px solid rgba(255,255,255,.3);
  box-shadow:0 3px 10px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.3);
}
.team-badge.lg{width:64px; height:64px; font-size:19px;}
.jersey-svg{ flex-shrink:0; filter:drop-shadow(0 4px 8px rgba(0,0,0,.55)); }

/* ---- Celebration confetti ---- */
.confetti-wrap{
  position:fixed; top:0; left:0; right:0; height:100vh;
  overflow:hidden; pointer-events:none; z-index:0;
}
.confetti-piece{
  position:absolute; top:-20px;
  width:9px; height:14px;
  opacity:.9;
  animation-name: confetti-fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
@keyframes confetti-fall{
  0%{ transform:translateY(0) rotate(0deg); opacity:1; }
  100%{ transform:translateY(110vh) rotate(360deg); opacity:.7; }
}
.team-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.team-row .tname{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px;}
.team-row .tname small{display:block; color:var(--chalk-dim); font-weight:400; font-size:11.5px; letter-spacing:.5px; text-transform:uppercase;}

/* ---- Stat bar ---- */
.statbar{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-bottom:16px;
}
.stat{
  background:linear-gradient(160deg, rgba(255,255,255,.04), transparent 60%), var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:8px 4px;
  text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 6px rgba(0,0,0,.25);
}
.stat .v{font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.5px; color:var(--chalk);}
.stat .k{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--chalk-dim);}
.stat.warn .v{color:var(--danger); text-shadow:0 0 10px rgba(217,119,46,.5);}
.stat.good .v{color:var(--gold); text-shadow:0 0 10px rgba(200,16,46,.5);}
.statbar-4{grid-template-columns:repeat(4,1fr);}

/* ---- Player card (hexagonal HUD) ---- */
.player-card{
  clip-path: polygon(0 14px, 14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px));
  background:
    radial-gradient(ellipse at 15% 0%, rgba(200,16,46,.18), transparent 55%),
    linear-gradient(135deg, #101d40, var(--panel));
  border:1px solid var(--gold-dim);
  box-shadow:0 0 0 1px rgba(200,16,46,.15), 0 14px 36px rgba(0,0,0,.5);
  padding:18px;
  margin-bottom:18px;
}
.pc-top{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}
.pc-ovr{ text-align:center; flex-shrink:0; }
.pc-ovr-num{ font-family:'Anton',sans-serif; font-size:44px; line-height:1; color:var(--chalk); text-shadow:1px 1px 0 var(--gold-dim), 2px 2px 0 #4a0713, 3px 4px 6px rgba(0,0,0,.6); }
.pc-ovr-label{ font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:2px; color:var(--chalk-dim); text-transform:uppercase; }
.pc-id{ flex:1; min-width:0; }
.pc-name{ font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px; color:var(--chalk); }
.pc-form{ font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:1px; color:var(--chalk-dim); margin-top:2px; }
.pc-form.up{ color:var(--gold); }
.pc-form.down{ color:var(--danger); }
.stage-tag{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border:1px solid var(--gold-dim);
  border-radius:12px;
  padding:10px 14px;
  background:rgba(200,16,46,.06);
}
.stage-label{ font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1.5px; color:var(--gold); }

.money-line{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:8px 12px;
  margin-bottom:12px;
}
.money-amount{ font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.5px; color:#7fd68f; }
.shop-btn{
  background:rgba(215,173,63,.08);
  border:1px solid var(--gold-dim);
  color:var(--gold);
  font-family:'Oswald',sans-serif; font-weight:600; font-size:11.5px;
  border-radius:10px; padding:6px 10px; cursor:pointer;
}
.shop-btn:hover{ background:rgba(200,16,46,.15); }

/* ---- Archetype cards ---- */
.archetype-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;
}
.archetype-card{
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:16px;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.archetype-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
.archetype-name{ font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.5px; color:var(--chalk); margin-bottom:6px; }
.archetype-card .tags{ margin-top:10px; }

/* ---- Transfer market offer cards ---- */
.offer-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.offer-card{
  position:relative;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:14px 14px 14px;
  overflow:hidden;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.offer-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
.offer-bar{ position:absolute; top:0; left:0; right:0; height:5px; }
.offer-badge{
  position:absolute; top:10px; right:10px;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.5px;
  text-transform:uppercase;
  padding:3px 8px; border-radius:10px;
  border:1px solid var(--gold-dim); color:var(--gold);
  background:rgba(200,16,46,.1);
}
.offer-badge.good{ border-color:#3f7a4a; color:#7fd68f; background:rgba(63,122,74,.15); }
.offer-team-row{ display:flex; align-items:center; gap:8px; margin:8px 0 8px; }
.offer-team-name{ font-family:'Oswald',sans-serif; font-weight:600; font-size:12.5px; color:var(--chalk); line-height:1.2; }
.offer-salary{ font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--gold); letter-spacing:.5px; }
.offer-salary span{ font-family:'Inter',sans-serif; font-size:10.5px; color:var(--chalk-dim); letter-spacing:0; margin-left:4px; }
.offer-quote{ font-size:12px; font-style:italic; color:var(--chalk-dim); margin:8px 0; line-height:1.4; }
.offer-upside{ font-size:10.5px; color:#7fd68f; font-weight:600; }
.offer-bonus{ font-size:11px; color:var(--chalk-dim); margin:2px 0 4px; }
.offer-downside{ font-size:10.5px; color:#f0a868; font-weight:600; }
@media (max-width:480px){
  .offer-grid{ grid-template-columns:1fr; }
}

.meta-row{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-bottom:16px;
}
.chip{
  background:linear-gradient(160deg, rgba(255,255,255,.04), transparent), var(--turf);
  border:1px solid var(--turf-line);
  border-radius:20px;
  padding:5px 12px;
  font-size:12.5px;
  color:var(--chalk-dim);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.chip b{color:var(--chalk); font-weight:600;}

/* ---- Choice buttons ---- */
.choices{display:flex; flex-direction:column; gap:10px;}
.choice-btn{
  background:linear-gradient(135deg, var(--turf), rgba(255,255,255,.015));
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:14px 16px;
  text-align:left;
  color:var(--chalk);
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  transition:border-color .15s, transform .12s, background .15s, box-shadow .15s;
  width:100%;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.choice-btn:hover{border-color:var(--gold); background:#16265a; transform:translateY(-2px); box-shadow:0 6px 18px rgba(200,16,46,.25);}
.choice-btn:active{transform:scale(0.99);}
.choice-btn .label{font-weight:600; display:block; margin-bottom:4px;}
.rarity-badge{
  display:block;
  font-family:'Oswald',sans-serif;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:1.5px;
  margin-bottom:5px;
}
.choice-btn .tags{display:flex; gap:6px; flex-wrap:wrap;}
.tag{
  font-size:10.5px;
  padding:2px 7px;
  border-radius:10px;
  letter-spacing:.3px;
  font-family:'Oswald',sans-serif;
}
.tag.up{background:rgba(215,173,63,.15); color:var(--gold);}
.tag.down{background:rgba(217,119,46,.15); color:#f0a868;}
.tag.risk{background:rgba(217,119,46,.22); color:#f5c295;}
.tag.info{background:rgba(111,143,176,.2); color:#b8cbe0;}

/* ---- Buttons general ---- */
.btn{
  display:inline-block;
  background:linear-gradient(135deg, #ff3b5c, var(--gold) 60%, var(--gold-dim));
  color:#fff5f5;
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:1px;
  font-size:17px;
  border:none;
  border-radius:10px;
  padding:12px 24px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(200,16,46,.35);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(200,16,46,.5); filter:brightness(1.08); }
.btn:active{ transform:translateY(0); }
.btn.secondary{
  background:transparent;
  border:1px solid var(--gold-dim);
  color:var(--gold);
  box-shadow:none;
}
.btn.secondary:hover{background:rgba(215,173,63,.08); box-shadow:none; transform:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* ---- Intro forms ---- */
.option-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
  margin-bottom:20px;
}
.pos-btn{
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:12px 10px;
  cursor:pointer;
  text-align:center;
  color:var(--chalk);
}
.pos-btn .code{font-family:'Anton',sans-serif; font-size:24px; color:var(--gold); display:block;}
.pos-btn .name{font-size:11.5px; color:var(--chalk-dim); display:block; margin-top:2px;}
.pos-btn.selected{border-color:var(--gold); background:#16265a;}

input[type=text],input[type=number]{
  width:100%;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:10px;
  padding:12px 14px;
  color:var(--chalk);
  font-size:15px;
  font-family:'Inter',sans-serif;
  margin-bottom:18px;
}
input[type=text]:focus,input[type=number]:focus{outline:none; border-color:var(--gold);}
input[type=number]{ font-family:'Bebas Neue',sans-serif; font-size:20px; text-align:center; }
.name-number-row{ display:flex; gap:12px; align-items:flex-start; }

.event-icon{
  font-family:'Bebas Neue',sans-serif;
  font-size:14px;
  color:var(--gold-dim);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:6px;
}

.divider{height:1px; background:var(--turf-line); margin:16px 0;}

/* ---- Season article (newspaper style) ---- */
.article-mast{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:3px double var(--turf-line);
  padding-bottom:8px;
  margin-bottom:14px;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#6f8fb0;
}
.article-date{ color:var(--chalk-dim); font-weight:500; letter-spacing:1px; font-size:10.5px; }
.article-headline{
  font-family:'Anton',sans-serif;
  text-transform:uppercase;
  font-size:clamp(24px,6vw,32px);
  line-height:1.05;
  color:var(--chalk);
  margin:0 0 12px;
  text-shadow:1px 1px 0 var(--gold-dim), 2px 2px 0 #4a0713, 3px 4px 6px rgba(0,0,0,.55);
}
.bullet-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }

/* ---- Draft Card ---- */
.draft-card{
  position:relative;
  background:linear-gradient(160deg, #101d40, var(--panel));
  border:2px solid var(--gold);
  border-radius:16px;
  padding:24px 20px 20px;
  text-align:center;
  overflow:hidden;
  box-shadow:0 12px 32px rgba(0,0,0,.55);
}
.draft-card-bar{ position:absolute; top:0; left:0; right:0; height:8px; }
.draft-card-header{
  display:flex; justify-content:space-between;
  font-family:'Oswald',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px;
  color:var(--gold); margin:10px 0 18px;
}
.draft-card-team{ font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; color:var(--chalk-dim); margin-bottom:6px; }
.draft-card-name{
  font-family:'Anton',sans-serif; font-size:clamp(26px,7vw,36px); color:#fff;
  text-transform:uppercase; margin-bottom:8px; line-height:1.05;
}
.draft-card-meta{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:1px; color:var(--chalk-dim); margin-bottom:16px; }
.draft-card-jersey{ display:flex; justify-content:center; }
.bullet{
  display:flex; gap:10px; align-items:flex-start;
  padding-left:10px;
  border-left:3px solid var(--info);
  font-size:13.5px; color:var(--chalk-dim); line-height:1.5;
}
.b-icon{ flex-shrink:0; }

.clasico-card{
  border-color:var(--gold);
  background:linear-gradient(165deg, #2a0c14, var(--panel));
  box-shadow:0 0 0 1px rgba(200,16,46,.25), 0 8px 24px rgba(200,16,46,.12);
}
.clasico-card .event-icon{
  color:var(--gold);
  font-size:16px;
  letter-spacing:2px;
}

.hof-banner{
  text-align:center;
  padding:26px 16px;
  border-radius:16px;
  background:linear-gradient(160deg, #16265a, #0c1836);
  border:1px solid var(--gold-dim);
  margin-bottom:18px;
}
.hof-banner .tier{
  font-family:'Anton',sans-serif;
  text-transform:uppercase;
  font-size:clamp(24px,7vw,36px);
  color:var(--gold);
  margin:8px 0 4px;
  text-shadow:1px 1px 0 #7a0a1f, 2px 2px 0 #4a0713, 3px 4px 10px rgba(200,16,46,.5), 0 0 24px rgba(200,16,46,.35);
}
.timeline{
  font-size:13px;
  color:var(--chalk-dim);
  border-left:2px solid var(--turf-line);
  padding-left:12px;
  margin:4px 0 4px 4px;
}
.timeline .yr{color:var(--gold); font-weight:600; font-family:'Oswald',sans-serif;}

/* ---- Feedback screen ---- */
.feedback-block{
  background:var(--turf);
  border:1px solid var(--gold-dim);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}
.feedback-quote{
  font-size:15px;
  line-height:1.55;
  color:var(--chalk);
  margin:0 0 14px;
  font-style:italic;
}
.delta-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.delta-chip{
  font-family:'Bebas Neue',sans-serif;
  font-size:14px;
  letter-spacing:.5px;
  padding:6px 12px;
  border-radius:10px;
  background:var(--panel);
  border:1px solid var(--turf-line);
}
.delta-chip.pos{color:var(--gold); border-color:var(--gold-dim);}
.delta-chip.neg{color:#f0a868; border-color:#7a4a1f;}

/* ---- Trophy case ---- */
.trophy-case{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.trophy{
  position:relative;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:12px 6px;
  text-align:center;
}
.trophy .t-icon{font-size:22px; margin-bottom:2px; filter:grayscale(0.6) opacity(0.55);}
.trophy .t-count{font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--chalk-dim);}
.trophy .t-label{font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--chalk-dim); margin-top:2px;}
.trophy.earned{border-color:var(--gold); background:linear-gradient(160deg,#16265a,var(--turf)); box-shadow:0 0 14px rgba(200,16,46,.3);}
.trophy.earned .t-icon{filter:none;}
.trophy.earned .t-count{color:var(--gold);}
.trophy.earned .t-label{color:var(--chalk);}
.trophy .t-badge{
  position:absolute; top:-8px; right:-6px;
  background:var(--gold); color:#fff5f5;
  font-family:'Oswald',sans-serif; font-weight:700;
  font-size:9px; letter-spacing:.3px;
  padding:2px 6px; border-radius:10px;
  box-shadow:0 2px 4px rgba(0,0,0,.4);
}
@media (max-width:480px){
  .trophy-case{grid-template-columns:repeat(2,1fr);}
}

@media (max-width:480px){
  .statbar{grid-template-columns:repeat(3,1fr);}
}

/* ---- Shop (Tienda) ---- */
.shop-grid{ display:flex; flex-direction:column; gap:8px; }
.shop-grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.shop-item{
  display:flex; align-items:center; gap:12px;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  padding:12px 14px;
  cursor:pointer;
  transition:border-color .15s;
}
.shop-item:hover{ border-color:var(--gold); }
.shop-item.owned{ opacity:.55; cursor:default; }
.shop-item.luxury{ flex-direction:column; align-items:flex-start; gap:4px; }
.shop-icon{ font-size:22px; flex-shrink:0; }
.shop-info{ flex:1; min-width:0; }
.shop-name{ font-family:'Oswald',sans-serif; font-weight:600; font-size:13.5px; color:var(--chalk); }
.shop-price{ font-family:'Bebas Neue',sans-serif; font-size:16px; color:#7fd68f; white-space:nowrap; }
.skill-btn{
  background:var(--gold); color:#fff5f5; border:none; border-radius:10px;
  font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.5px;
  padding:8px 14px; cursor:pointer; flex-shrink:0;
}
.skill-btn:disabled{ background:var(--turf-line); color:var(--chalk-dim); cursor:not-allowed; }

/* ---- Final trophy vitrine (museum glass case) ---- */
.trophy-vitrine{
  position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01) 40%, transparent),
             linear-gradient(160deg, #101d40, var(--panel));
  border:1px solid var(--gold-dim);
  border-top:3px solid var(--gold);
  border-radius:var(--radius);
  padding:22px 20px;
  margin-bottom:16px;
  overflow:hidden;
}
.vitrine-spotlight{
  position:absolute;
  top:-60px; left:50%;
  transform:translateX(-50%);
  width:70%; height:140px;
  background:radial-gradient(ellipse at center, rgba(200,16,46,.25), transparent 70%);
  pointer-events:none;
}
.vitrine-title{
  font-family:'Anton',sans-serif;
  text-transform:uppercase;
  text-align:center;
  font-size:clamp(22px,6vw,30px);
  color:var(--chalk);
  letter-spacing:1px;
  margin:0 0 4px;
  position:relative;
}
.trophy-shelf{ position:relative; padding:12px 0 16px; }
.trophy-shelf-label{
  font-family:'Oswald',sans-serif; font-weight:700; font-size:12.5px;
  letter-spacing:.5px; text-transform:uppercase; margin-bottom:8px;
}
.trophy-shelf-label b{ color:var(--chalk); font-weight:700; }
.trophy-shelf-icons{
  display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:32px;
}
.trophy-icon-repeat{
  font-size:24px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
}
.trophy-extra{
  font-family:'Bebas Neue',sans-serif; font-size:15px; color:var(--chalk-dim);
  align-self:center; margin-left:4px;
}
.trophy-empty{ font-size:12.5px; color:var(--chalk-dim); font-style:italic; }
.trophy-shelf-line{
  position:absolute; bottom:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, transparent, var(--turf-line) 15%, var(--turf-line) 85%, transparent);
  border-radius:2px;
}

/* ---- NFL Combine minigames ---- */
.combine-track{
  position:relative;
  height:40px;
  background:var(--turf);
  border:1px solid var(--turf-line);
  border-radius:12px;
  margin-bottom:16px;
  overflow:hidden;
}
.combine-zone{
  position:absolute; top:0; bottom:0;
  left:72%; width:18%;
  background:rgba(127,214,143,.25);
  border-left:2px dashed rgba(127,214,143,.6);
  border-right:2px dashed rgba(127,214,143,.6);
}
.combine-marker{
  position:absolute; top:3px; bottom:3px;
  width:6px;
  background:var(--gold);
  box-shadow:0 0 10px var(--gold);
  border-radius:3px;
  left:0%;
}
.cone-row{
  display:flex; justify-content:space-around; align-items:center;
  gap:12px; padding:24px 0; margin-bottom:8px;
}
.cone{
  font-size:44px;
  opacity:.35;
  filter:grayscale(1);
  cursor:pointer;
  transition:opacity .15s, filter .15s, transform .15s;
  padding:10px;
}
.cone:hover{ transform:scale(1.05); }
.cone.active{
  opacity:1;
  filter:grayscale(0) drop-shadow(0 0 12px rgba(200,16,46,.7));
  transform:scale(1.15);
}
</style>

function badgeHtml(team, size){
  const cls = size==='lg' ? 'team-badge lg' : 'team-badge';
  return `<div class="${cls}" style="background:linear-gradient(150deg, ${team.c1}, ${team.c2}); color:#fff;">${team.abbr}</div>`;
}

function escapeXml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getLastName(){
  const parts = S.name.trim().split(/\s+/).filter(Boolean);
  return parts.length ? parts[parts.length-1].toUpperCase() : 'ROOKIE';
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function refillQueue(pos){
  const pool = EVENT_POOL.filter(e => e.groups.includes('all') || e.groups.includes(pos.group));
  eventQueue = shuffle(pool);
}

function nextEvent(pos){
  if(eventQueue.length === 0) refillQueue(pos);
  return eventQueue.pop();
}

function rand(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

const _nativeRandom = Math.random.bind(Math);
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(str){
  let seed = 0;
  for(let i=0;i<str.length;i++) seed = (seed*31 + str.charCodeAt(i)) | 0;
  return seed;
}

const HISTORY_KEY = 'plp_nfl_career_history_v1';
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }catch(e){ return []; }
}
function saveHistoryEntry(entry){
  try{
    const hist = loadHistory();
    hist.unshift(entry);
    hist.sort((a,b)=>b.score-a.score);
    while(hist.length > 25) hist.pop();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  }catch(e){}
}

function renderPrep(){
  const round = PREP_ROUNDS[S.prepStep];
  const opts = round.opts.map((o,i)=>`
    <div class="choice-btn" data-idx="${i}">
      <span class="label">${o.label}</span>
      <div class="tags"><span class="tag up">${o.tag}</span></div>
    </div>
  `).join('');
  el(`
    <div class="eyebrow">Camino al Draft — Paso ${S.prepStep+1} de ${PREP_ROUNDS.length}</div>
    <h1 class="display">${round.title}</h1>
    <p class="lead">${round.text}</p>
    <div class="card"><div class="choices">${opts}</div></div>
  `);
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const o = round.opts[parseInt(b.dataset.idx)];
      S.prepScoreByGroup[pos().group] += o.bonus[pos().group];
      if(o.fame) S.prepFame += o.fame;
      if(o.health) S.prepHealth += o.health;
      if(o.quimica) S.quimica = clamp(S.quimica + o.quimica, 0, 100);
      if(o.presion) S.presion = clamp(S.presion + o.presion, 0, 100);
      if(S.prepStep === 0){
        S.trainingFocus = o.tag;
        if(o.tag === 'Físico') S.combineTrainingBonus.bench += 18;
        else if(o.tag === 'Atlético') S.combineTrainingBonus.dash += 18;
        else if(o.tag === 'Técnico') S.combineTrainingBonus.agility += 18;
        else if(o.tag === 'Mental'){ S.combineTrainingBonus.agility += 10; S.combineTrainingBonus.dash += 8; }
      }
      S.prepStep++;
      if(S.prepStep >= PREP_ROUNDS.length){
        S.screen = 'combine';
        S.combineStep = 0;
        render();
      } else {
        render();
      }
    });
  });
}

  if(score >= 85) return "¡Marca de combine histórica! Los ojeadores ya están tomando notas.";

}

function renderDashDrill(){
  const bonus = S.combineTrainingBonus.dash||0;
  el(`

    <h1 class="display">40 Yardas</h1>

  `);
  let pos_ = 0, dir = 1;

function renderBenchDrill(){

function renderAgilityDrill(){
  const bonus = S.combineTrainingBonus.agility||0;
  el(`
    ${fieldTracker()}
    <div class="eyebrow">NFL Combine — Prueba 3 de 3</div>
    <h1 class="display">Drill de Agilidad</h1>
    <div class="card">
      <p class="lead">Toca los conos en el orden en que se iluminen, lo más rápido posible.</p>
      <div class="cone-row">
        <div class="cone" data-idx="0">🔶</div>
        <div class="cone" data-idx="1">🔶</div>
        <div class="cone" data-idx="2">🔶</div>
      </div>
    </div>
  `);
  const order = shuffle([0,1,2]);
  let step = 0, segStart = Date.now(), totalMs = 0;
  const cones = document.querySelectorAll('.cone');
  function lightCurrent(){
    cones.forEach(c=>c.classList.remove('active'));
    cones[order[step]].classList.add('active');
    segStart = Date.now();
  }
  lightCurrent();
  cones.forEach(c=>{
    c.addEventListener('click', ()=>{
      const idx = parseInt(c.dataset.idx);
      if(idx !== order[step]) return;
      totalMs += (Date.now()-segStart);
      step++;
      if(step >= 3){
        const score = clamp(Math.round(100 - (totalMs-600)/18) + bonus, 5, 100);
        S.combineScores.agility = score;
        renderDrillResultScreen('Drill de Agilidad', score, finishCombine);
      } else {
        lightCurrent();
      }
    });
  });
}

const COLLEGE_STAT_LINES = {
  QB:(n)=>`En su última temporada universitaria lanzó para ${n} yardas.`,
  RB:(n)=>`En su última temporada universitaria corrió para ${n} yardas.`,
  WR:(n)=>`En su última temporada universitaria acumuló ${n} yardas de recepción.`,
  TE:(n)=>`En su última temporada universitaria atrapó pases para ${n} yardas.`,
  OL:(n)=>`Permitió apenas ${n} sacks en toda su última temporada universitaria.`,
  DL:(n)=>`Registró ${n} capturas de mariscal en su última temporada universitaria.`,
  LB:(n)=>`Acumuló ${n} tacleadas en su última temporada universitaria.`,
  CB:(n)=>`Registró ${n} pases desviados en su última temporada universitaria.`,
  S:(n)=>`Registró ${n} intercepciones en su última temporada universitaria.`,
  K:(n)=>`Convirtió el ${n}% de sus goles de campo en su última temporada universitaria.`,
};

function generateCollegeStatLine(){
  const code = pos().code;
  let n;
  switch(code){
    case 'QB': n = Math.round(rand(2200,4200)); S.collegeStatBonus = (n-3200)/120; break;
    case 'RB': n = Math.round(rand(700,1900)); S.collegeStatBonus = (n-1250)/60; break;
    case 'WR': case 'TE': n = Math.round(rand(500,1400)); S.collegeStatBonus = (n-900)/45; break;
    case 'OL': n = Math.round(rand(0,6)); S.collegeStatBonus = (3-n)*2.5; break;
    case 'DL': case 'LB': n = Math.round(rand(3,14)); S.collegeStatBonus = (n-8)*1.6; break;
    case 'CB': n = Math.round(rand(4,18)); S.collegeStatBonus = (n-10)*1.3; break;
    case 'S': n = Math.round(rand(1,7)); S.collegeStatBonus = (n-4)*2.8; break;
    case 'K': n = Math.round(rand(72,96)); S.collegeStatBonus = (n-84)*0.9; break;
    default: n = 0; S.collegeStatBonus = 0;
  }
  return COLLEGE_STAT_LINES[code](n);
}

function finishCombine(){
  const sc = S.combineScores;
  S.combineScore = Math.round((sc.dash+sc.bench+sc.agility)/3);
  S.collegeStatLine = generateCollegeStatLine();
  S.screen = 'combinesummary';
  render();
}

function combineRealWorldLine(){
  const dashTime = (5.32 - (S.combineScores.dash/100)*1.04).toFixed(2);
  const benchReps = Math.round(7 + (S.combineScores.bench/100)*29);
  const agilityTime = (8.25 - (S.combineScores.agility/100)*1.85).toFixed(2);
  const pct = clamp(Math.round(S.combineScore + rand(-4,4)), 1, 99);
  return `Corriste las 40 yardas en <b>${dashTime}s</b>, hiciste <b>${benchReps} repeticiones</b> de banca, y marcaste <b>${agilityTime}s</b> en el 3-cone drill. Eso te deja mejor que el <b>${pct}%</b> de los prospectos de tu clase.`;
}

function runDraft(){
  const college = COLLEGES[S.collegeIdx];
  let score = college.stock + S.prepScoreByGroup[pos().group]*1.6 + (S.combineScore-50)*0.5 + (S.collegeStatBonus||0) + rand(-6,6);
  score = clamp(score, 0, 100);

  let round, ovrBase, ovrRange;
  if(score >= 90){ round='Ronda 1'; ovrBase=65; ovrRange=8; }
  else if(score >= 73){ round='Ronda 2'; ovrBase=61; ovrRange=6; }
  else if(score >= 56){ round='Ronda 3'; ovrBase=57; ovrRange=6; }
  else if(score >= 37){ round='Rondas 4-5'; ovrBase=53; ovrRange=6; }
  else if(score >= 20){ round='Rondas 6-7'; ovrBase=49; ovrRange=5; }
  else { round='Agente Libre No Drafteado'; ovrBase=47; ovrRange=6; }

  S.ovr = clamp(Math.round(ovrBase + rand(0,ovrRange)), 40, 80);
  S.team = TEAMS[Math.floor(Math.random()*TEAMS.length)];
  S.fame = clamp(Math.round((round==='Ronda 1'?18:round==='Ronda 2'?10:5) + S.prepFame), 0, 100);
  S.health = clamp(90 + S.prepHealth, 0, 100);

  // Apply permanent Origin identity bonus, chosen at 16
  const ob = S.origin.bonus;
  if(ob.ovr) S.ovr = clamp(S.ovr + ob.ovr, 30, 99);
  if(ob.fame) S.fame = clamp(S.fame + ob.fame, 0, 100);
  if(ob.health) S.health = clamp(S.health + ob.health, 0, 100);
  if(ob.quimica) S.quimica = clamp(S.quimica + ob.quimica, 0, 100);
  if(ob.legacy) S.legacy += ob.legacy;
  if(ob.presion) S.presion = clamp(S.presion + ob.presion, 0, 100);
  if(ob.iq) S.iq = clamp(S.iq + ob.iq, 0, 100);
  if(ob.durability) S.durability = clamp(S.durability + ob.durability, 0, 100);
  if(ob.money) S.money = Math.round((S.money + ob.money)*10)/10;
  if(S.origin.growthMultiplier) S.growthMultiplier = S.origin.growthMultiplier;

  S.peakOvr = S.ovr;
  S.prevOvr = S.ovr;
  S.age = 21;

  // Signing bonus in millions of USD, scaled to real NFL rookie contract ranges
  const bonusByRound = {'Ronda 1':22, 'Ronda 2':9, 'Ronda 3':4.5, 'Rondas 4-5':2, 'Rondas 6-7':0.9, 'Agente Libre No Drafteado':0.2};
  S.money = Math.round((S.money + bonusByRound[round] + rand(-1,1)) * 10) / 10;
  if(S.money < 0.1) S.money = 0.1;

  let pickNumber;
  if(round==='Ronda 1') pickNumber = Math.floor(rand(1,33));
  else if(round==='Ronda 2') pickNumber = Math.floor(rand(33,65));
  else if(round==='Ronda 3') pickNumber = Math.floor(rand(65,97));
  else if(round==='Rondas 4-5') pickNumber = Math.floor(rand(97,177));
  else if(round==='Rondas 6-7') pickNumber = Math.floor(rand(177,258));
  else pickNumber = 0;
  S.draftPickNumber = pickNumber;

  S.draft = { round, score:Math.round(score), collegeTag: college.tag };
  S.timeline.push({yr:'Draft', text:`Elegido en ${round} por los ${S.team.name}, ${college.tag}.`});
  S.screen = 'draftcard';
  render();
}

const RARITY_DEFS = [
  {key:'normal', label:'Normal', color:'#9aa7c4', mult:0.65},
  {key:'rara', label:'Rara', color:'#4f9dd6', mult:0.85},
  {key:'epica', label:'Épica', color:'#b06fe0', mult:1.05},
  {key:'unica', label:'Única', color:'#c8102e', mult:1.3},
];

function rollRarity(){
  const r = Math.random();
  if(r < 0.58) return RARITY_DEFS[0];
  if(r < 0.85) return RARITY_DEFS[1];
  if(r < 0.97) return RARITY_DEFS[2];
  return RARITY_DEFS[3];
}

function rollRarities(count){
  return Array.from({length:count}, rollRarity);
}

function setPendingEvent(ev){
  S.pendingEvent = ev;
  S.pendingRarities = rollRarities(ev.choices.length);
}

function scaleFx(fx, mult){
  if(!fx) return fx;
  const out = {};
  Object.keys(fx).forEach(k=>{ out[k] = fx[k]*mult; });
  return out;
}

function renderEvent(){
  const ev = S.pendingEvent;
  const posLabel = pos().label.toLowerCase();
  const text = ev.text(pos()).replace('{posLabel}', posLabel);
  const rarities = S.pendingRarities;
  const choices = ev.choices.map((c,i)=>{
    const rarity = rarities[i];
    return `
    <div class="choice-btn" data-idx="${i}" style="border-left:3px solid ${rarity.color};">
      <span class="rarity-badge" style="color:${rarity.color};">${rarity.label.toUpperCase()}</span>
      <span class="label">${c.label}</span>
      <div class="tags">${c.tags.map(t=>`<span class="tag ${t.t}">${t.s}</span>`).join('')}</div>
    </div>
  `;}).join('');
  el(`
    ${fieldTracker()}
    <div class="eyebrow">Temporada ${S.year} · Edad ${S.age}</div>
    ${playerCardHtml()}
    <div class="card ${ev.banner ? 'clasico-card' : ''}">
      <div class="event-icon">${ev.icon}</div>
      <h2 class="section">Decisión del año</h2>
      <p class="lead">${text}</p>
      <div class="choices">${choices}</div>
    </div>
  `);
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = parseInt(b.dataset.idx);
      const c = ev.choices[idx];
      const rarity = rarities[idx];
      const deltas = applyEffects(scaleFx(c.fx, rarity.mult));
      const resolveType = ev.resolveType || 'normal';
      if(resolveType === 'normal'){
        S.pendingRiskMod = (c.riskMod||0) * rarity.mult;
        S.pendingDecisionFeedback = { text: c.feedback, deltas };
        simulateSeason();
      } else if(resolveType === 'playoff'){
        const ph = S.pendingSeasonPhase1;
        const awardsMultiplier = ph.injured ? 0.35 : 1;
        const sbChance = clamp(0.08*awardsMultiplier + (c.boost||0) + (S.clutch-50)/380, 0, 0.5);
        const won = Math.random() < sbChance;
        ph.notes.push(c.feedback);
        if(won){
          setPendingEvent(pickSbMoment());
          S.screen = 'event';
          render();
        } else {
          finalizeSeason(false);
        }
      } else if(resolveType === 'sb'){
        S.pendingSeasonPhase1.notes.push(c.feedback);
        finalizeSeason(true);
      }
    });
  });
}

const STAT_LABELS = {ovr:'Nivel', health:'Salud', fame:'Fama', quimica:'Química', presion:'Presión', legacy:'Legado', money:'Dinero', iq:'IQ Táctico', clutch:'Clutch', durability:'Resistencia', coachTrust:'Confianza del Coach'};
function effectScale(){ return 1.15 * (DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano).effectMult; }

function applyEffects(fx){
  const deltas = {};
  if(!fx) return deltas;
  if(fx.ovr){
    const growth = fx.ovr > 0 ? (S.growthMultiplier||1) : 1;
    const before=S.ovr; S.ovr = clamp(S.ovr + fx.ovr*effectScale()*growth + rand(-2.5,3.5), 25, 99); deltas.ovr = Math.round(S.ovr-before);
  }
  if(fx.health){ const before=S.health; S.health = clamp(S.health + fx.health*effectScale() + rand(-2,2), 0, 100); deltas.health = Math.round(S.health-before); }
  if(fx.fame){ const before=S.fame; S.fame = clamp(S.fame + fx.fame*effectScale() + rand(-1.5,1.5), 0, 100); deltas.fame = Math.round(S.fame-before); }
  if(fx.quimica){ const before=S.quimica; S.quimica = clamp(S.quimica + fx.quimica*effectScale() + rand(-1.5,1.5), 0, 100); deltas.quimica = Math.round(S.quimica-before); }
  if(fx.presion){ const before=S.presion; S.presion = clamp(S.presion + fx.presion*effectScale() + rand(-1.5,1.5), 0, 100); deltas.presion = Math.round(S.presion-before); }
  if(fx.iq){ const before=S.iq; S.iq = clamp(S.iq + fx.iq*effectScale(), 0, 100); deltas.iq = Math.round(S.iq-before); }
  if(fx.clutch){ const before=S.clutch; S.clutch = clamp(S.clutch + fx.clutch*effectScale(), 0, 100); deltas.clutch = Math.round(S.clutch-before); }
  if(fx.durability){ const before=S.durability; S.durability = clamp(S.durability + fx.durability*effectScale(), 0, 100); deltas.durability = Math.round(S.durability-before); }
  if(fx.coachTrust){ const before=S.coachTrust; S.coachTrust = clamp(S.coachTrust + fx.coachTrust*effectScale(), 0, 100); deltas.coachTrust = Math.round(S.coachTrust-before); }
  if(fx.legacy){ const scaled = Math.round(fx.legacy*1.4); S.legacy += scaled; deltas.legacy = scaled; }
  if(fx.money){ const scaled = Math.round(fx.money*10)/10; S.money = Math.round((S.money+scaled)*10)/10; deltas.money = scaled; }
  S.peakOvr = Math.max(S.peakOvr, S.ovr);
  return deltas;
}

function deltaChipsHtml(deltas){
  const chips = Object.keys(deltas).map(k=>{
    const v = deltas[k];
    if(!v) return '';
    const cls = v > 0 ? 'pos' : 'neg';
    const sign = v > 0 ? '+' : '';
    const display = k === 'money' ? `${sign}$${v}M` : `${sign}${v}`;
    return `<div class="delta-chip ${cls}">${STAT_LABELS[k]} ${display}</div>`;
  }).join('');
  return chips || '<div class="delta-chip">Sin cambios inmediatos</div>';
}

function renderFeedback(){
  const fb = S.pendingFeedback;
  const chips = deltaChipsHtml(fb.deltas);
  const isRetirementFlow = S.afterFeedback === 'retirement';

function computeSeasonStats(gp){
  const ovrFactor = S.ovr/70;
  const code = pos().code;
  let stats = {};
  if(code==='QB'){
    stats = {
      'Yardas por Pase': Math.max(0,Math.round(gp*215*ovrFactor + rand(-400,400))),
      'Touchdowns de Pase': Math.max(0,Math.round(gp*1.6*ovrFactor + rand(-3,5))),
      'Intercepciones': Math.max(0,Math.round(gp*0.5/ovrFactor + rand(-2,3))),
    };
  } else if(code==='RB'){
    stats = {
      'Yardas Corriendo': Math.max(0,Math.round(gp*68*ovrFactor + rand(-200,200))),
      'Touchdowns': Math.max(0,Math.round(gp*0.5*ovrFactor + rand(-2,4))),
      'Acarreos': Math.max(0,Math.round(gp*14*ovrFactor)),
    };
  } else if(code==='WR' || code==='TE'){
    stats = {
      'Recepciones': Math.max(0,Math.round(gp*4*ovrFactor + rand(-10,10))),
      'Yardas de Recepción': Math.max(0,Math.round(gp*54*ovrFactor + rand(-150,150))),
      'Touchdowns': Math.max(0,Math.round(gp*0.4*ovrFactor + rand(-1,3))),
    };
  } else if(code==='OL'){
    stats = {
      'Pancakes': Math.max(0,Math.round(gp*2*ovrFactor + rand(-5,10))),
      'Sacks Permitidos': Math.max(0,Math.round(gp*0.3/ovrFactor + rand(-1,2))),
    };
  } else if(code==='DL' || code==='LB'){
    stats = {
      'Tacleadas': Math.max(0,Math.round(gp*4*ovrFactor + rand(-10,15))),
      'Sacks': Math.max(0,Math.round(gp*0.4*ovrFactor + rand(-1,3))),
    };
  } else if(code==='CB' || code==='S'){
    stats = {
      'Tacleadas': Math.max(0,Math.round(gp*3*ovrFactor + rand(-8,10))),
      'Intercepciones': Math.max(0,Math.round(gp*0.15*ovrFactor + rand(-1,2))),
    };
  } else if(code==='K'){
    stats = {
      'Goles de Campo': Math.max(0,Math.round(gp*1.3*ovrFactor + rand(-3,5))),
      'Efectividad %': clamp(Math.round(70+ovrFactor*15+rand(-5,5)),50,99),
    };
  }
  return stats;
}

function accumulateCareerStats(seasonStats){
  const prevCount = S.seasonsPlayed;
  Object.keys(seasonStats).forEach(k=>{
    if(k.includes('%')){
      S.careerStats[k] = (S.careerStats[k]===undefined) ? seasonStats[k] : Math.round((S.careerStats[k]*prevCount + seasonStats[k])/(prevCount+1));
    } else {
      S.careerStats[k] = (S.careerStats[k]||0) + seasonStats[k];
    }
  });
}

  {key:'concussion', label:'Conmoción Cerebral', desc:'Un golpe directo a la cabeza te dejó viendo estrellas en plena jugada.'},
  {key:'muscle', label:'Lesión Muscular', desc:'Sentiste tirar el músculo a mitad de una jugada y no pudiste seguir el ritmo.'},

function simulateSeason(){
  const p = pos();
  const ovrBeforeSeason = S.ovr;

  const ageFactor = S.age > 27 ? 0.085 : 0;
  const healthFactor = (1 - S.health/130);
  const durabilityReduction = (S.durability-50)/700 + (S.ownedItems.physio ? 0.04 : 0);
  const diffPreset = DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano;
  const injChance = clamp((p.risk * healthFactor + ageFactor + (S.pendingRiskMod||0) - durabilityReduction) * diffPreset.injuryMult, 0.02, 0.65);

  if(Math.random() < injChance){
    const sev = rand(8,32);
    const type = sev > 24 ? INJURY_TYPES[2] : (Math.random()<0.35 ? INJURY_TYPES[0] : INJURY_TYPES[1]);
    S.pendingInjury = { type, sev, ovrBeforeSeason };
    S.screen = 'injurymoment';
    render();
  } else {
    continueSeasonAfterInjury(17, [], false, ovrBeforeSeason);
  }
}

      </div>
    </div>
  `);
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const notes = [];
      let gamesPlayed;
      if(inj.type.key === 'severe'){
        S.everSeverelyInjured = true;
      }
      if(b.dataset.c === 'play'){
        gamesPlayed = Math.round(rand(13,17));
        S.fame = clamp(S.fame+6,0,100);
        S.legacy += 5;
        const riskChance = inj.type.key==='severe' ? 0.5 : 0.28;
        if(Math.random() < riskChance){
          S.ovr = clamp(S.ovr - rand(8,16), 25, 99);
          S.durability = clamp(S.durability - rand(10,20), 0, 100);
          S.everSeverelyInjured = true;
          notes.push(`Jugaste infiltrado y el cuerpo pasó factura a largo plazo: la lesión dejó secuelas permanentes.`);
        } else {
          notes.push(`Jugaste infiltrado con analgésicos. La afición admira tu entrega, y esta vez el cuerpo aguantó.`);
        }
      } else {
        gamesPlayed = Math.round(rand(3,11));
        S.fame = clamp(S.fame-3,0,100);
        S.durability = clamp(S.durability+4,0,100);
        S.health = clamp(S.health+6,0,100);
        notes.push(`Paraste a tiempo y priorizaste tu salud a largo plazo, aunque te perdiste buena parte de la temporada.`);
      }
      S.worstInjuryMissedGames = Math.max(S.worstInjuryMissedGames||0, 17-gamesPlayed);
      S.pendingInjury = null;
      continueSeasonAfterInjury(gamesPlayed, notes, true, inj.ovrBeforeSeason);
    });
  });
}

function continueSeasonAfterInjury(gamesPlayed, priorNotes, injured, ovrBeforeSeason){
  let notes = priorNotes.slice();
  const diffPreset = DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano;

  // Team performance — chemistry and team quality add a real boost, wider random swing for variety
  const teamStrength = S.ovr + rand(-16,16) + (S.quimica-50)/5 + (S.teamQuality||0) - 6;
  const winPct = clamp(teamStrength/138, 0.07, 0.8);
  const wins = Math.round(winPct*17);

  // Division race — strong teams contend, chemistry tips close races
  let divisionChamp = false;
  if(wins >= 8){
    const divChance = clamp(((wins-8)*0.1 + (S.quimica-50)/320) * diffPreset.awardsMult, 0.02, 0.7);
    divisionChamp = Math.random() < divChance;
  }
  const playoffs = divisionChamp || wins >= 11 || (wins===10 && Math.random()<0.5) || (wins===9 && Math.random()<0.25);

  // Awards — media pressure and IQ affect consistency, chemistry and fame help
  let awardsMultiplier = injured ? 0.6 : 1;
  const pbChance = clamp(((S.ovr-64)/105 + S.fame/480 + (S.quimica-50)/600 + (S.iq-50)/550 - S.presion/380) * awardsMultiplier * diffPreset.awardsMult, 0, 0.42);
  let madeProBowl = false, madeAllPro = false, madeMVP = false;
  if(Math.random() < pbChance){
    madeProBowl = true;
    S.proBowls++;
    S.legacy += 6;
    S.fame = clamp(S.fame+5,0,100);
    notes.push(`Fuiste seleccionado al Pro Bowl.`);
    S.proBowlStreak = (S.proBowlStreak||0) + 1;
    S.bestProBowlStreak = Math.max(S.bestProBowlStreak||0, S.proBowlStreak);
    if(S.proBowlStreak >= 3){
      S.legacy += 3;
      notes.push(`Encadenaste tu Pro Bowl número ${S.proBowlStreak} seguido — una racha dorada.`);
    }
    if(Math.random() < 0.42){
      madeAllPro = true;
      S.allPro++;
      S.legacy += 10;
      notes.push(`Además, fuiste nombrado All-Pro.`);
      if(S.ovr >= 88 && Math.random() < 0.2){
        madeMVP = true;
        S.mvps++;
        S.legacy += 15;
        S.fame = clamp(S.fame+10,0,100);
        notes.push(`¡Y te coronaste MVP de la temporada!`);
      }
    }
  } else {
    S.proBowlStreak = 0;
  }
  if(divisionChamp){
    S.divisionTitles++;
    S.legacy += 7;
    notes.push(`Fuiste Campeón Divisional con los ${S.team.name}.`);
  }

  // Coaching stability check every 5 seasons
  if(S.year % 5 === 0){
    if(S.coachTrust < 40 && Math.random() < 0.6){
      notes.push(`Despidieron al entrenador en jefe tras temporadas flojas. Llega un nuevo esquema y toca ganarte la confianza de cero.`);
      S.coachTrust = 55;
      S.quimica = clamp(S.quimica-10, 0, 100);
      S.presion = clamp(S.presion+10, 0, 100);
    }
  }

  // Position-specific stats for the season
  const seasonStats = computeSeasonStats(gamesPlayed);
  accumulateCareerStats(seasonStats);

  // Money income (boosted if your Agent strategy prioritizes maximizing dinero, or you own a Súper Representante)
  const agentBoost = (S.agentStrategy === 'money' ? 1.3 : 1) * (S.ownedItems.agent ? 1.25 : 1);
  const moneyGain = Math.round((S.ovr/14 + S.fame/28 + rand(0,1.6)) * agentBoost * 10)/10;
  S.money = Math.round((S.money + moneyGain)*10)/10;
  notes.push(`Ganaste $${moneyGain}M USD esta temporada.`);

  // Earn a skill point for completing the season
  S.skillPoints++;

  S.pendingSeasonPhase1 = { notes, wins, playoffs, divisionChamp, madeProBowl, madeAllPro, madeMVP, injured, seasonStats, ovrBeforeSeason };

  if(playoffs){
    setPendingEvent(pickPlayoffMoment());
    S.screen = 'event';
    render();
  } else {
    finalizeSeason(false);
  }
}

function finalizeSeason(wonSuperBowl){
  const ph = S.pendingSeasonPhase1;
  let notes = ph.notes;

  if(wonSuperBowl){
    S.rings++;
    S.legacy += 25;
    S.fame = clamp(S.fame+18,0,100);
    notes.push(`¡Ganaste el Super Bowl con los ${S.team.name}!`);
  } else if(ph.playoffs){
    notes.push(`Los ${S.team.name} se quedaron en el camino en playoffs, cerrando ${ph.wins}-${17-ph.wins}.`);
  } else {
    notes.push(`Los ${S.team.name} cerraron la temporada ${ph.wins}-${17-ph.wins}, sin playoffs.`);
  }

  // Presión decays a bit each year if not reinforced (faster with a sports psychologist); chemistry drifts toward 55
  S.presion = clamp(S.presion - (5 + (S.ownedItems.psych ? 3 : 0)), 0, 100);
  S.quimica = clamp(S.quimica + (55 - S.quimica) * 0.08, 0, 100);

  // Passive health drift tied to Durability (and a personal chef): resilient bodies recover, fragile ones wear down
  S.health = clamp(S.health + (S.durability-50)/20 + (S.ownedItems.cook ? 2 : 0), 0, 100);

  // Age decline (delayed by higher Durability, and further by a dedicated trainer)
  const durabilityDelay = Math.round((S.durability-50)/15) + (S.ownedItems.trainer ? 2 : 0);
  if(S.age >= 29+durabilityDelay){
    S.ovr = clamp(S.ovr - rand(1.5, 3 + (S.age-29-durabilityDelay)*0.35), 30, 99);
  }
  if(S.age >= 31+durabilityDelay){
    S.health = clamp(S.health - 4, 0, 100);
  }

  S.peakOvr = Math.max(S.peakOvr, S.ovr);
  S.seasonsPlayed++;
  S.timeline.push({yr:`Año ${S.year}`, text: notes.join(' ')});

  S.pendingSeasonNote = { notes, wins:ph.wins, playoffs:ph.playoffs, divisionChamp:ph.divisionChamp, madeProBowl:ph.madeProBowl, madeAllPro:ph.madeAllPro, madeMVP:ph.madeMVP, wonSuperBowl, injured:ph.injured, decisionFeedback: S.pendingDecisionFeedback, seasonStats: ph.seasonStats };
  S.pendingDecisionFeedback = null;
  S.prevOvr = ph.ovrBeforeSeason;

  if(wonSuperBowl || ph.madeMVP){
    S.pendingCelebration = wonSuperBowl ? 'superbowl' : 'mvp';
    S.screen = 'celebration';
  } else {
    S.screen = 'seasonresult';
  }
  render();
}

  great: ["LA TEMPORADA DE TU VIDA", "EL AÑO EN QUE TODO CAMBIÓ", "ASÍ SE CONSTRUYE UNA LEYENDA"],
  good: ["UN AÑO PARA EL RECUERDO", "LA CONFIRMACIÓN DEFINITIVA", "EL SALTO DE CALIDAD"],
  decent: ["PASO A PASO, SIN PRISA", "TRABAJO SILENCIOSO, RESULTADOS CLAROS", "UN LADRILLO MÁS EN EL LEGADO"],
  injury: ["BARRO, CAMILLA Y APRENDIZAJE", "EL CUERPO PASA FACTURA", "UNA TEMPORADA PARA OLVIDAR"],
  mediocre: ["BARRO, MICRO Y APRENDIZAJE", "AÑO DE TRANSICIÓN", "SIN BRILLO, PERO SIN RENDIRSE"],
};

function seasonHeadline(r){
  let tier;
  if(r.wonSuperBowl) tier='superbowl';
  else if(r.divisionChamp || r.madeAllPro) tier='great';
  else if(r.madeProBowl) tier='good';
  else if(r.injured) tier='injury';
  else if(r.playoffs) tier='decent';
  else tier='mediocre';
  const pool = SEASON_HEADLINES[tier];
  return pool[Math.floor(Math.random()*pool.length)];
}

function iconForNote(note){
  if(note.includes('lesión')) return '🩹';
  if(note.includes('archirrival')) return '⚔️';
  if(note.includes('Pro Bowl') || note.includes('All-Pro')) return '⭐';
  if(note.includes('Campeón Divisional')) return '🎖️';
  if(note.includes('Super Bowl')) return '🏆';
  if(note.includes('playoffs') || note.includes('récord')) return '📊';
  return '📋';
}

function animateCountUp(){
  document.querySelectorAll('.statbar .v').forEach(elm=>{
    const target = parseFloat(elm.textContent);
    if(isNaN(target)) return;
    const duration = 650;
    const startTime = performance.now();
    function step(now){
      const p = Math.min((now-startTime)/duration, 1);
      const val = Math.round(target*p);
      elm.textContent = val;
      if(p<1) requestAnimationFrame(step);
      else elm.textContent = target;
    }
    requestAnimationFrame(step);
  });
}

const CONTENDER_TEAMS = ["Dallas Cowboys","Green Bay Packers","Kansas City Chiefs","San Francisco 49ers","Philadelphia Eagles","Buffalo Bills"];
const REBUILDING_TEAMS = ["Jacksonville Jaguars","Carolina Panthers","New York Giants","Las Vegas Raiders","Chicago Bears","Tennessee Titans"];

const OFFER_QUOTES = [
  "Te ofrecen el gafete de capitán en un año.",
  "Bono por touchdown escrito en el contrato.",
  "Promesa de titularidad indiscutida desde el primer día.",
  "Te quieren como la nueva cara de la franquicia.",
];

function renderContract(){
  const contenderTeam = TEAMS.find(t=>t.name === CONTENDER_TEAMS[Math.floor(Math.random()*CONTENDER_TEAMS.length)]) || TEAMS[Math.floor(Math.random()*TEAMS.length)];
  const rebuildingTeam = TEAMS.find(t=>t.name === REBUILDING_TEAMS[Math.floor(Math.random()*REBUILDING_TEAMS.length)]) || TEAMS[Math.floor(Math.random()*TEAMS.length)];
  const randomPool = TEAMS.filter(t=>t.name!==S.team.name && t.name!==contenderTeam.name && t.name!==rebuildingTeam.name);
  const randomTeam = shuffle(randomPool)[0];
  const agentSalaryBoost = S.agentStrategy === 'money' ? 1.3 : 1;
  const base = (S.ovr-40)*0.55 + S.fame*0.15;

  function makeOffer(team, type){
    let salary, badge;
    if(type==='contender'){
      salary = Math.max(2, Math.round((base*0.7 + rand(-1,3))*10)/10);
      badge = 'CONTENDIENTE';
    } else if(type==='rebuilding'){
      salary = Math.max(2, Math.round((base*1.45 + rand(2,10)) * agentSalaryBoost *10)/10);
      badge = 'RECONSTRUCCIÓN';
    } else {
      salary = Math.max(2, Math.round((base + rand(-2,6)) * agentSalaryBoost *10)/10);
      badge = Math.random()<0.3 ? 'BOMBAZO' : null;
    }
    const bonus = Math.round(salary*0.35*10)/10;
    const noTrade = Math.random() < 0.4;
    return { team, type, salary, bonus, noTrade, years: Math.floor(rand(2,5)), quote: OFFER_QUOTES[Math.floor(Math.random()*OFFER_QUOTES.length)], badge };
  }

  const offers = [makeOffer(contenderTeam,'contender'), makeOffer(rebuildingTeam,'rebuilding'), makeOffer(randomTeam,'balanced')];
  const renewalSalary = Math.max(2, Math.round((base*0.9 + rand(-1,4)) * agentSalaryBoost *10)/10);
  const renewalBonus = Math.round(renewalSalary*0.3*10)/10;

  const renewalCard = `
    <div class="offer-card" data-c="extend">
      <div class="offer-bar" style="background:linear-gradient(90deg, ${S.team.c1}, ${S.team.c2});"></div>
      <div class="offer-badge good">RENOVACIÓN</div>
      <div class="offer-team-row">${badgeHtml(S.team)}<div class="offer-team-name">${S.team.name}</div></div>
      <div class="offer-salary">$${renewalSalary}M<span>/año</span></div>
      <div class="offer-bonus">Bono por Firma: $${renewalBonus}M</div>
      <p class="offer-quote">"Te ofrecen una extensión para seguir siendo la cara de la franquicia."</p>
      <div class="offer-upside">🔒 Incluye cláusula de no-trade · + Legado y Química</div>
    </div>`;

  const offerCards = offers.map(o=>`
    <div class="offer-card" data-c="trade" data-team="${o.team.name}" data-salary="${o.salary}" data-bonus="${o.bonus}" data-type="${o.type}">
      <div class="offer-bar" style="background:linear-gradient(90deg, ${o.team.c1}, ${o.team.c2});"></div>
      ${o.badge ? `<div class="offer-badge ${o.type==='contender'?'good':''}">${o.badge}</div>` : ''}
      <div class="offer-team-row">${badgeHtml(o.team)}<div class="offer-team-name">${o.team.name}</div></div>
      <div class="offer-salary">$${o.salary}M<span>/año · ${o.years} años</span></div>
      <div class="offer-bonus">Bono por Firma: $${o.bonus}M</div>
      <p class="offer-quote">"${o.quote}"</p>
      ${o.noTrade ? '<div class="offer-upside">🔒 Cláusula de no-trade incluida</div>' : ''}
      <div class="offer-downside">Dejas a los ${S.team.name}: − Química de equipo</div>
    </div>
  `).join('');

  el(`
    ${fieldTracker()}
    ${playerCardHtml()}
    <div class="card">
      <h2 class="section">Mercado de Agentes Libres</h2>
      <p class="lead">Tu contrato con los ${S.team.name} está por vencer. Recibes ofertas de franquicias históricas y de equipos en reconstrucción con mucho espacio salarial. Elige: ¿gloria o cartera?</p>
      <div class="offer-grid">${renewalCard}${offerCards}</div>
      <button class="btn secondary" id="holdoutBtn" style="width:100%; margin-top:14px;">📞 Amenazar con un paro para renegociar (una vez por carrera)</button>
    </div>
  `);

  document.querySelectorAll('.offer-card').forEach(b=>{
    b.addEventListener('click', ()=>{
      const c = b.dataset.c;
      if(c==='extend'){
        S.pendingRenewalSalary = renewalSalary;
        S.pendingRenewalBonus = renewalBonus;
        S.screen = 'negotiate';
        render();
        return;
      }
      const newTeam = TEAMS.find(t=>t.name===b.dataset.team);
      const bonus = parseFloat(b.dataset.bonus);
      const type = b.dataset.type;
      S.team = newTeam;
      S.teamChangesCount = (S.teamChangesCount||0) + 1;
      S.teamQuality = type==='contender' ? 8 : (type==='rebuilding' ? -8 : 0);
      const deltas = applyEffects({fame:4, quimica:-5, money:bonus});
      const feedbackText = type==='contender'
        ? `Firmaste con los ${newTeam.name}, una franquicia histórica armada para pelear el título. Menos dinero, más presión por ganar ya.`
        : (type==='rebuilding'
          ? `Firmaste con los ${newTeam.name}, un equipo en plena reconstrucción. El contrato es enorme, pero el roster todavía no está a la altura.`
          : `Firmaste con los ${newTeam.name}. Nueva ciudad, nueva presión, la misma ambición de siempre.`);
      S.timeline.push({yr:`Año ${S.year}`, text: feedbackText});
      S.pendingFeedback = { text: feedbackText, deltas };
      S.afterFeedback = 'retirement';
      S.screen = 'feedback';
      render();
    });
  });
  document.getElementById('holdoutBtn').addEventListener('click', ()=>{
    const deltas = applyEffects({fame:6, presion:8, quimica:-4, money:2});
    const feedbackText = `Tu paro generó ruido mediático y tensión con la gerencia, aunque conseguiste el contrato que buscabas.`;
    S.timeline.push({yr:`Año ${S.year}`, text: feedbackText});
    S.pendingFeedback = { text: feedbackText, deltas };
    S.afterFeedback = 'retirement';
    S.screen = 'feedback';
    render();
  });
}

  el(`

function checkRetirement(){
  const forcedRetire = S.age >= 40 || S.ovr <= 33;
  const offerRetire = S.age >= 33 || (S.ovr < 46 && S.age >= 27) || S.health < 25;

  if(forcedRetire){
    endCareer("La organización decidió no renovarte. Tu cuerpo y tu nivel ya no dan para más.");
    return;
  }
  if(offerRetire){
    S.screen = 'retireprompt';
    render();
    return;
  }
  goToEvent();
}

const SKILL_MAX_LEVEL = 5;

function renderShop(){
  const tree = SKILL_TREES[pos().code];
  const rows = tree.map(node=>{
    const level = S.skills[node.key] || 0;
    const maxed = level >= SKILL_MAX_LEVEL;
    const canAfford = S.skillPoints > 0 && !maxed;
    return `
    <div class="shop-item ${maxed?'owned':''}" data-key="${node.key}">
      <div class="shop-icon">${node.icon}</div>
      <div class="shop-info">
        <div class="shop-name">${node.name} <span class="sub">· Nivel ${level}/${SKILL_MAX_LEVEL}</span></div>
        <p class="sub" style="margin:2px 0 0;">${node.desc}</p>
      </div>
      <button class="skill-btn" data-key="${node.key}" ${canAfford?'':'disabled'}>${maxed?'MAX':'+1'}</button>
    </div>`;
  }).join('');

  el(`
    <div class="eyebrow">🌳 Árbol de Habilidades</div>
    <h1 class="display">Entrenamiento Específico</h1>
    <div class="card">
      <div class="money-line" style="margin-bottom:16px;">
        <span class="money-amount">${S.skillPoints} puntos de habilidad disponibles</span>
      </div>
      <p class="sub" style="margin-bottom:14px;">Ganas 1 punto de habilidad por cada temporada completa. Invertilos en lo que defina tu estilo de juego como ${pos().label}.</p>
      <div class="shop-grid">${rows}</div>
      <button class="btn" id="backBtn" style="width:100%; margin-top:16px;">← Volver</button>
    </div>
  `);
  document.querySelectorAll('.skill-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      const node = tree.find(n=>n.key===b.dataset.key);
      const level = S.skills[node.key] || 0;
      if(level >= SKILL_MAX_LEVEL || S.skillPoints <= 0) return;
      S.skillPoints--;
      S.skills[node.key] = level+1;
      Object.keys(node.effect).forEach(k=>{
        if(k==='ovr') S.ovr = clamp(S.ovr + node.effect.ovr, 30, 99);
        else if(k==='iq') S.iq = clamp(S.iq + node.effect.iq, 0, 100);
        else if(k==='clutch') S.clutch = clamp(S.clutch + node.effect.clutch, 0, 100);
        else if(k==='durability') S.durability = clamp(S.durability + node.effect.durability, 0, 100);
      });
      S.peakOvr = Math.max(S.peakOvr, S.ovr);
      render();
    });
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{
    S.screen = S.returnScreen || 'seasonresult';
    render();
  });
}

function endCareer(closingLine){
  S.retired = true;
  const hofMult = (DIFFICULTY_PRESETS[S.difficulty]||DIFFICULTY_PRESETS.veterano).hofMult;
  const score = Math.round(
    (S.legacy + S.rings*15 + S.mvps*12 + S.proBowls*4 + S.allPro*7 + S.divisionTitles*3 + S.peakOvr*0.5 + S.seasonsPlayed*1.5) / hofMult
  );
  let tier, tierDesc;
  if(score >= 210){
    tier = "Te ganaste la estatua";
    tierDesc = "Primera elección al Salón de la Fama, sin discusión. Tu figura va a estar afuera del estadio para siempre.";
  } else if(score >= 155){
    tier = "A un voto de la estatua";
    tierDesc = "Finalista perenne del Salón de la Fama. Tu carrera genera debate cada año en la votación — tarde o temprano, entras.";
  } else if(score >= 105){
    tier = "Ícono de tu Franquicia";
    tierDesc = "No llegaste a la estatua, pero tu nombre va a estar siempre en la historia de tu equipo.";
  } else if(score >= 65){
    tier = "Titular Sólido, Carrera de Rol";
    tierDesc = "Una carrera respetable de profesional confiable, sin la exposición de una estrella.";
  } else {
    tier = "Jugador de Roster / Equipos Especiales";
    tierDesc = "Tu carrera fue breve o discreta, pero jugaste en la NFL — algo que casi nadie logra.";
  }
  S.finalScore = score;
  S.finalTier = tier;
  S.finalTierDesc = tierDesc;
  S.closingLine = closingLine;
  S.achievements = ACHIEVEMENTS_DEFS.filter(a=>a.test());
  S.screen = 'retirementceremony';
  render();
}

    {icon:'🏆', label:'Super Bowls Ganados', count:S.rings, color:'var(--gold)'},
    {icon:'👑', label:'Premios MVP', count:S.mvps, color:'#f0a868'},
    {icon:'🎖️', label:'Títulos de División', count:S.divisionTitles, color:'#7fd68f'},
    {icon:'🥇', label:'Selecciones All-Pro', count:S.allPro, color:'#b06fe0'},
    {icon:'⭐', label:'Selecciones Pro Bowl', count:S.proBowls, color:'#4f9dd6'},
  ];
  const shelves = items.map(it=>{
    const capped = Math.min(it.count, 12);
    const icons = Array.from({length:capped}, ()=>`<span class="trophy-icon-repeat" style="color:${it.color};">${it.icon}</span>`).join('');
    const extra = it.count > 12 ? `<span class="trophy-extra">+${it.count-12}</span>` : '';
    return `
      <div class="trophy-shelf">
        <div class="trophy-shelf-label" style="color:${it.color};">${it.label} <b>(${it.count})</b></div>
        <div class="trophy-shelf-icons">${it.count>0 ? icons+extra : '<span class="trophy-empty">— Ninguno todavía —</span>'}</div>
        <div class="trophy-shelf-line"></div>
      </div>
    `;
  }).join('');
  return `
    <div class="trophy-vitrine">
      <div class="vitrine-spotlight"></div>
      <div class="vitrine-title text-3d">VITRINA DE TROFEOS</div>
      <p class="sub" style="text-align:center; margin:0 0 18px;">La colección completa de ${S.name}, ${pos().label} #${S.jerseyNumber}</p>
      ${shelves}
    </div>
  `;
}

const RECORD_CHECKS = {
  QB: [{key:'Yardas por Pase', threshold:55000, label:'yardas por aire'}, {key:'Touchdowns de Pase', threshold:450, label:'touchdowns por pase'}],
  RB: [{key:'Yardas Corriendo', threshold:16000, label:'yardas por tierra'}],
  WR: [{key:'Yardas de Recepción', threshold:20000, label:'yardas de recepción'}],
  TE: [{key:'Yardas de Recepción', threshold:12000, label:'yardas de recepción para un ala cerrada'}],
  OL: [{key:'Pancakes', threshold:900, label:'pancakes en una carrera'}],
  DL: [{key:'Sacks', threshold:180, label:'capturas de mariscal'}],
  LB: [{key:'Sacks', threshold:150, label:'capturas de mariscal para un apoyador'}],
  CB: [{key:'Intercepciones', threshold:55, label:'intercepciones'}],
  S: [{key:'Intercepciones', threshold:45, label:'intercepciones para un profundo'}],
  K: [{key:'Goles de Campo', threshold:550, label:'goles de campo'}],
};

function checkRecords(){
  const checks = RECORD_CHECKS[pos().code] || [];
  return checks.filter(c => (S.careerStats[c.key]||0) > c.threshold)
    .map(c => `¡Rompiste el récord histórico de la liga en ${c.label} (${S.careerStats[c.key]})!`);
}

function shareCardHtml(){
  return `
    <div id="shareCard" style="background:linear-gradient(160deg, #101d40, #0c1836); border:2px solid var(--gold); border-radius:16px; padding:26px 22px; text-align:center;">
      <div style="font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:3px; color:var(--gold); margin-bottom:10px;">CAMINO A CANTON · PLATICAPATRIOT</div>
      <div style="display:flex; justify-content:center; margin-bottom:12px;">${jerseyHtml(S.team, S.jerseyNumber, 84)}</div>
      <div style="font-family:'Anton',sans-serif; font-size:28px; color:#fff; text-transform:uppercase;">${S.name}</div>
      <div style="font-family:'Oswald',sans-serif; font-size:13px; color:var(--chalk-dim); margin-bottom:14px;">${pos().label} #${S.jerseyNumber} · ${S.team.name}</div>
      <div style="font-family:'Anton',sans-serif; font-size:22px; color:var(--gold); text-transform:uppercase; margin-bottom:6px;">${S.finalTier}</div>
      <div style="display:flex; justify-content:center; gap:16px; margin-top:12px; flex-wrap:wrap;">
        <div><div style="font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fff;">${S.rings}</div><div style="font-size:9px; color:var(--chalk-dim); letter-spacing:1px;">ANILLOS</div></div>
        <div><div style="font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fff;">${S.mvps}</div><div style="font-size:9px; color:var(--chalk-dim); letter-spacing:1px;">MVP</div></div>
        <div><div style="font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fff;">${S.proBowls}</div><div style="font-size:9px; color:var(--chalk-dim); letter-spacing:1px;">PRO BOWL</div></div>
        <div><div style="font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fff;">${S.seasonsPlayed}</div><div style="font-size:9px; color:var(--chalk-dim); letter-spacing:1px;">TEMPORADAS</div></div>
        <div><div style="font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fff;">${S.finalScore}</div><div style="font-size:9px; color:var(--chalk-dim); letter-spacing:1px;">LEGADO</div></div>
      </div>
    </div>
  `;
}

function renderEnd(){
  const tl = S.timeline.slice(-10).map(t=>`<div><span class="yr">${t.yr}:</span> ${t.text}</div>`).join('');
  const careerStatChips = Object.keys(S.careerStats).map(k=>`
    <div class="stat"><div class="v">${S.careerStats[k]}</div><div class="k">${k}</div></div>
  `).join('');
  const records = checkRecords();
  const achievementsHtml = (S.achievements||[]).length ? `
    <div class="divider"></div>
    <h2 class="section">Logros Desbloqueados</h2>
    <div class="shop-grid">
      ${S.achievements.map(a=>`
        <div class="shop-item owned">
          <div class="shop-icon">${a.icon}</div>
          <div class="shop-info"><div class="shop-name">${a.name}</div><p class="sub" style="margin:2px 0 0;">${a.desc()}</p></div>
        </div>
      `).join('')}
    </div>
  ` : '';
  el(`
    <div class="eyebrow">${S.isDaily ? `Carrera del Día · ${S.dailySeedLabel}` : '¿Llegaste a la estatua?'}</div>
    <h1 class="display">${S.name}</h1>
    <div class="team-row">${jerseyHtml(S.team, S.jerseyNumber, 64)}<div class="tname" style="font-size:16px;">${pos().label} #${S.jerseyNumber}<small>${S.seasonsPlayed} temporadas · Pico de nivel ${Math.round(S.peakOvr)}</small></div></div>
    <div class="hof-banner">
      <div class="eyebrow" style="margin:0;">Veredicto</div>
      <div class="tier text-3d">${S.finalTier}</div>
      <p class="sub" style="max-width:480px;margin:0 auto;">${S.finalTierDesc}</p>
      ${S.finalScore >= 155 ? `<button class="btn" id="hofBtn" style="margin-top:14px;">🏛️ Ver tu Inducción a Canton</button>` : ''}
    </div>
    <div class="card">
      <h2 class="section">${S.closingLine}</h2>
      ${S.postCareerPath ? `<p class="sub">${S.postCareerPath.icon} Después de retirarte, tu camino fue el de <b style="color:var(--chalk);">${S.postCareerPath.name}</b>: ${S.postCareerPath.desc}</p>` : ''}
      <div class="meta-row" style="margin-top:10px;">
        <span class="chip">Puntaje de Legado <b>${S.finalScore}</b></span>
        <span class="chip">Ganancias de Carrera <b>$${S.money}M USD</b></span>
      </div>
      ${records.length ? `<div class="divider"></div><div class="bullet-list">${records.map(r=>`<div class="bullet" style="border-left-color:var(--gold);">🏈 ${r}</div>`).join('')}</div>` : ''}
      ${achievementsHtml}
      <div class="divider"></div>
      <h2 class="section">Estadísticas de toda tu Carrera</h2>
      <div class="statbar" style="margin-bottom:16px;">${careerStatChips}</div>
    </div>
    ${finalTrophyVitrineHtml()}
    <div class="card">
      <h2 class="section">Tarjeta para Compartir</h2>
      ${shareCardHtml()}
      <button class="btn" id="downloadCardBtn" style="width:100%; margin-top:14px;">📸 Descargar Tarjeta</button>
    </div>
    <div class="card">
      <h2 class="section">Últimos capítulos de tu historia</h2>
      <div class="timeline">${tl}</div>
      <div class="divider"></div>
      <div class="btn-row">
        <button class="btn" id="againBtn">Jugar otra carrera</button>
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <p class="sub" style="margin-bottom:12px;">¿Te gustó el simulador? Podés invitarme un café para seguir mejorándolo.</p>
      <a href="https://www.paypal.com/ncp/payment/JWNYCGQ3SMW7J" target="_blank" rel="noopener" class="btn secondary" style="width:100%; display:block; text-decoration:none; text-align:center;">☕ Apoyar el Proyecto</a>
    </div>
    <p class="sub" style="text-align:center; opacity:.7;">Simulador no oficial hecho por fans. No está afiliado a la NFL ni a ninguna de sus franquicias.</p>
  `);
  document.getElementById('againBtn').addEventListener('click', newGame);
  const hofBtn = document.getElementById('hofBtn');
  if(hofBtn) hofBtn.addEventListener('click', ()=>{ S.screen='hofinduction'; render(); });
  document.getElementById('downloadCardBtn').addEventListener('click', ()=>{
    const node = document.getElementById('shareCard');
    if(typeof html2canvas === 'undefined'){ alert('No se pudo cargar el generador de imagen. Intenta de nuevo con conexión a internet.'); return; }
    html2canvas(node, {backgroundColor:'#0c1836', scale:2}).then(canvas=>{
      const link = document.createElement('a');
      link.download = `${S.name.replace(/\s+/g,'_')}_camino_a_canton.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });
  animateCountUp();
}

function renderHofInduction(){
  const yearsLater = Math.round(rand(3,6));
  el(`
    <div class="confetti-wrap">${Array.from({length:24}, ()=>{
      const left = Math.round(Math.random()*100);
      const delay = (Math.random()*1.2).toFixed(2);
      const dur = (2.2 + Math.random()*1.6).toFixed(2);
      const colors = ['#d7ad3f','#c8102e','#ffffff'];
      const color = colors[Math.floor(Math.random()*colors.length)];
      return `<div class="confetti-piece" style="left:${left}%; animation-delay:${delay}s; animation-duration:${dur}s; background:${color};"></div>`;
    }).join('')}</div>
    <div class="eyebrow">Canton, Ohio · ${yearsLater} años después</div>
    <h1 class="display">Inducción al <span>Salón de la Fama</span></h1>
    <div class="card" style="text-align:center;">
      <div style="font-size:64px; margin-bottom:10px;">🏛️</div>
      <p class="lead">${yearsLater} años después de colgar los botines, ${S.name} camina hasta el podio en Canton. Se descubre el busto de bronce con tu rostro, y tu gafete queda junto al de las leyendas que definieron esta liga.</p>
      <div class="feedback-block">
        <p class="feedback-quote">"Nunca jugué pensando en este momento. Jugué por mis compañeros, por mi ciudad, por el amor a este juego. Pero estar aquí, hoy, con mi gafete dorado... eso no tiene precio."</p>
        <p class="sub">— ${S.name}, discurso de inducción</p>
      </div>
      <div class="meta-row" style="justify-content:center;">
        <span class="chip">Anillos <b>${S.rings}</b></span>
        <span class="chip">MVP <b>${S.mvps}</b></span>
        <span class="chip">Pro Bowls <b>${S.proBowls}</b></span>
        <span class="chip">Puntaje de Legado <b>${S.finalScore}</b></span>
      </div>
      <button class="btn" id="hofBackBtn" style="width:100%; margin-top:16px;">← Volver al Reporte Final</button>
    </div>
  `);
  document.getElementById('hofBackBtn').addEventListener('click', ()=>{ S.screen='end'; render(); });
}

newGame();
})();
</script>
</body>
</html>
